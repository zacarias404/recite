<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生物专业英语卡片 · 细胞生物学 / 生物化学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Ma+Shan+Zheng&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* —— 手账纸感配色 —— */
    --paper:#F7F9F4;          /* 柔和浅米底色 */
    --card:#FCFDFA;           /* 卡片纸 */
    --ink:#37402f;            /* 墨绿黑 */
    --ink-soft:#7c8572;       /* 次要文字 */
    --green:#429958;          /* 主色 清新自然绿 */
    --green-deep:#2f7d4f;
    --orange:#E67A38;         /* 点缀暖橘 */
    --bad:#d9594c;            /* 答错/没记住 红 */
    --line:#c9d3c2;           /* 手绘细线 */
    --tape:#42995826;         /* 胶带绿 */
    --tape-o:#E67A3822;       /* 胶带橘 */
    --hl:#fdf2b0;             /* 荧光高亮 */
    --hand:"Ma Shan Zheng", "Kalam", "Caveat", cursive;
    --hand-en:"Caveat", "Kalam", cursive;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    /* 淡淡笔记压痕（横线）+ 极淡网格 */
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 30px, #6e8a6e10 30px, #6e8a6e10 31px),
      repeating-linear-gradient(90deg, transparent, transparent 30px, #6e8a6e08 30px, #6e8a6e08 31px);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  #app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  /* 宽屏（平板横屏）容器加宽，两侧留白交给装饰层 */
  @media (min-width:760px){
    #app{max-width:880px;}
    .hero{padding:24px 30px 6px;}
    .hero h1{font-size:30px;}
    .hero .sub{font-size:15px;max-width:70%;}
    .bookcard{margin:20px 30px;padding:24px 26px;}
    .bookcard .bt .bn{font-size:21px;}
    .bookcard .bt .ba{font-size:12.5px;}
    .bookcard .badge{width:58px;height:58px;font-size:28px;}
    .bookcard .illbox{width:64px;height:80px;right:26px;top:18px;}
    .chap{margin:13px 30px;padding:17px 20px;}
    .chap .cn .t{font-size:16.5px;}
    .home-actions{margin:8px 30px 0;}
    .ghost{font-size:14.5px;padding:14px;}
    .topbar{padding:18px 26px 6px;}
    .topbar .title{font-size:19px;}
    .progwrap{padding:10px 30px 0;}
    .wordcard{margin:14px 30px;padding:34px 34px 28px;}
    .wordcard .en{font-size:44px;}
    .wordcard .en.m{font-size:33px;}
    .wordcard .en.l{font-size:26px;}
    .wordcard .kicker{font-size:17px;}
    .wordcard .ph{font-size:17px;}
    .wordcard .illcorner{width:76px;height:94px;right:26px;bottom:20px;}
    .opt{margin:13px 30px 0;padding:18px 22px 18px 26px;font-size:17.5px;}
    .opt::before{width:25px;height:25px;line-height:25px;font-size:15px;}
    .dontknow{width:calc(100% - 60px);margin:16px 30px 0;padding:15px;font-size:15px;}
    .reveal{margin:16px 30px 0;padding:18px 22px;}
    .reveal .rm{font-size:17px;}
    .nextrow{margin:18px 30px 8px;gap:14px;}
    .btn{padding:17px;font-size:17px;}
    .banner{margin:14px 30px;}
    .favitem{margin:13px 30px;padding:16px 18px;}
    .chaphead{margin:8px 30px 2px;}
    .reset{margin:22px 30px;}
  }


  /* —— 通用手账纸卡（随性手绘边线） —— */
  .paper{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:255px 14px 225px 16px/16px 225px 14px 255px;
    box-shadow:0 1px 0 #00000003, 0 7px 20px #3c5a3c0d;
    position:relative;
  }
  /* 胶带贴纸 */
  .tape{position:absolute;width:90px;height:26px;top:-13px;left:22px;z-index:3;
    background:var(--tape);
    background-image:repeating-linear-gradient(90deg,#ffffff22 0 6px,transparent 6px 12px);
    border-left:1px dashed #ffffff88;border-right:1px dashed #ffffff88;
    transform:rotate(-3deg);box-shadow:0 1px 2px #0000000d;}
  .tape.o{background:var(--tape-o);background-image:repeating-linear-gradient(90deg,#ffffff22 0 6px,transparent 6px 12px);}
  .tape.r{right:-14px;left:auto;top:24px;width:24px;height:78px;transform:rotate(4deg);
    background-image:repeating-linear-gradient(0deg,#ffffff22 0 6px,transparent 6px 12px);}

  /* 大写知识点分类标签 */
  .tag{display:inline-block;font-family:var(--hand-en);font-weight:700;letter-spacing:2.5px;
    text-transform:uppercase;font-size:13px;color:#fff;background:var(--green);
    padding:3px 11px;border-radius:4px;transform:rotate(-2deg);box-shadow:0 1px 2px #00000012;}
  .tag.o{background:var(--orange);}
  .tag.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green);}

  /* 手写批注 */
  .scribble{font-family:var(--hand);color:var(--ink-soft);font-size:15px;line-height:1.5;
    transform:rotate(-1.5deg);}
  .scribble.o{color:var(--orange);}

  /* —— 便利贴（sticky note） —— */
  .sticky{
    position:relative;padding:14px 16px 16px;font-size:13.5px;line-height:1.65;
    background:#FBF7C9;color:#5d5a34;
    box-shadow:0 6px 14px #00000012, inset 0 -18px 22px #00000005;
    transform:rotate(-1.2deg);
  }
  /* 左下折角 */
  .sticky::after{content:"";position:absolute;right:0;bottom:0;width:16px;height:16px;
    background:linear-gradient(135deg, transparent 50%, #e0daa8 50%);}
  .sticky.green{background:#E4F2E5;color:#2f5a37;}
  .sticky.green::after{background:linear-gradient(135deg, transparent 50%, #c4ddc8 50%);}
  .sticky.orange{background:#FCEADB;color:#8a4a1f;}
  .sticky.orange::after{background:linear-gradient(135deg, transparent 50%, #f0d0b2 50%);}
  .sticky.pink{background:#FBE3E4;color:#8a4040;}
  .sticky.pink::after{background:linear-gradient(135deg, transparent 50%, #f0c6c8 50%);}
  /* 图钉 */
  .pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ff8a5c, var(--orange) 62%, #b8571f);
    box-shadow:0 2px 4px #0000002e;}
  .sticky .pin-t{display:block;font-family:var(--hand);font-size:15px;font-weight:700;margin-bottom:4px;}

  /* —— 错词本 / 复习卡 —— */
  .panel{margin:14px 16px;padding:16px 18px;}
  .panel .ph2{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .panel .ph2 .ttl{font-weight:800;font-size:15px;}
  .panel .ph2 .num{font-family:var(--hand-en);font-size:14px;color:var(--ink-soft);}
  .wrongrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .chip{font-size:12.5px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--line);
    color:var(--ink-soft);background:var(--card);font-family:var(--hand-en);letter-spacing:.3px;}
  .chip b{color:var(--bad);font-family:inherit;}
  .chip.ok b{color:var(--green-deep);}


  /* 线描插画 */
  .ill{display:block;}
  .ill svg{display:block;width:100%;height:100%;}
  .deco{position:absolute;pointer-events:none;opacity:.85;}

  /* —— 顶栏 —— */
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;}
  .topbar .back{font-size:22px;color:var(--green-deep);background:none;border:none;cursor:pointer;
    width:38px;height:38px;line-height:34px;text-align:center;border-radius:50%;flex:0 0 auto;font-weight:700;}
  .topbar .back:active{background:#42995814;}
  .topbar .title{font-size:17px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.5px;}
  .topbar .meta{font-size:12px;color:var(--ink-soft);flex:0 0 auto;font-family:var(--hand-en);letter-spacing:1px;}

  .pad{padding:0 16px;}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* —— 首页 —— */
  .hero{padding:16px 18px 2px;position:relative;}
  .hero h1{font-size:25px;margin:0 0 6px;font-weight:900;letter-spacing:.5px;}
  .hero .sub{color:var(--ink-soft);font-size:13.5px;line-height:1.7;margin:0;max-width:88%;}
  .hero .deco{right:14px;top:6px;width:62px;height:78px;color:var(--green);opacity:.55;}
  .hero .stamp{position:absolute;right:16px;bottom:-6px;color:var(--orange);opacity:.85;transform:rotate(8deg);width:54px;height:54px;}

  .bookcard{margin:16px;padding:18px 16px 16px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:.12s;}
  .bookcard:active{transform:scale(.99);}
  .bookcard .row1{display:flex;align-items:center;gap:13px;}
  .badge{width:50px;height:50px;border-radius:15px 6px 15px 6px/6px 15px 6px 15px;display:flex;align-items:center;justify-content:center;
    font-size:24px;color:#fff;flex:0 0 auto;box-shadow:0 2px 6px #0000001a;transform:rotate(-2deg);}
  .bookcard .bt{flex:1;min-width:0;}
  .bookcard .bt .bn{font-size:18px;font-weight:800;letter-spacing:.3px;}
  .bookcard .bt .ba{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .bookcard .illbox{position:absolute;right:16px;top:14px;width:48px;height:60px;color:var(--green);opacity:.5;}
  .bar{height:9px;border-radius:7px;background:#e7ebe2;overflow:hidden;border:1px solid #dde3d6;}
  .bar > i{display:block;height:100%;border-radius:7px;
    background:repeating-linear-gradient(45deg,var(--green) 0 6px,#5bb072 6px 12px);}
  .bookcard .stat{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);font-family:var(--hand-en);letter-spacing:.5px;}
  .bookcard .stat b{color:var(--ink);font-weight:700;font-family:inherit;}
  .bookcard .tagline{display:flex;align-items:center;gap:8px;}

  /* —— 章节列表 —— */
  .chaphead{display:flex;align-items:center;justify-content:space-between;margin:6px 16px 2px;}
  .chap{margin:11px 16px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.12s;}
  .chap:active{transform:scale(.99);}
  .chap .dot{width:30px;height:30px;flex:0 0 auto;color:var(--green);opacity:.7;}
  .chap .cn{flex:1;min-width:0;}
  .chap .cn .t{font-size:15px;font-weight:700;}
  .chap .cn .s{font-size:12px;color:var(--ink-soft);margin-top:4px;font-family:var(--hand-en);letter-spacing:.5px;}
  .chap .go{color:var(--green-deep);font-size:20px;flex:0 0 auto;font-weight:700;}

  .home-actions{display:flex;gap:10px;margin:6px 16px 0;flex-wrap:wrap;}
  .ghost{flex:1;min-width:140px;background:var(--card);border:2px solid var(--line);border-radius:14px 5px 14px 5px/5px 14px 5px 14px;
    padding:12px;font-size:13.5px;color:var(--ink-soft);text-align:center;cursor:pointer;font-weight:600;}
  .ghost:active{background:#42995810;}

  /* —— 学习页 —— */
  .progwrap{padding:8px 16px 0;}
  .prog{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);margin-bottom:6px;
    font-family:var(--hand-en);letter-spacing:.8px;}
  .prog .mode{font-family:var(--hand);font-size:14px;color:var(--green-deep);}

  .wordcard{margin:10px 16px;padding:26px 22px 22px;}
  .wordcard .kicker{font-family:var(--hand-en);font-size:15px;color:var(--orange);letter-spacing:2px;text-transform:uppercase;}
  .wordcard .en{font-size:33px;font-weight:800;line-height:1.15;margin:4px 0 4px;letter-spacing:.3px;word-break:break-word;}
  /* 长术语自适应字号，避免挤成一团 */
  .wordcard .en.m{font-size:25px;line-height:1.28;}
  .wordcard .en.l{font-size:20px;line-height:1.32;font-weight:700;}
  .wordcard .ph{font-size:15px;color:var(--ink-soft);margin-bottom:4px;font-family:var(--hand-en);}
  .wordcard .illcorner{position:absolute;right:16px;bottom:14px;width:54px;height:68px;color:var(--green);opacity:.42;}
  .star{position:absolute;top:16px;right:16px;font-size:26px;cursor:pointer;color:#c4ccc0;background:none;border:none;line-height:1;
    transition:.15s;filter:drop-shadow(0 1px 1px #00000010);}
  .star.on{color:var(--orange);transform:rotate(8deg) scale(1.05);}

  .opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px 5px 14px 6px/6px 14px 5px 14px;
    padding:15px 16px;margin:11px 16px 0;font-size:16px;color:var(--ink);cursor:pointer;transition:.12s;line-height:1.4;position:relative;}
  .opt:active{background:#4299580d;transform:translateY(1px);}
  .opt::before{content:attr(data-k);position:absolute;left:-9px;top:50%;transform:translateY(-50%) rotate(-4deg);
    font-family:var(--hand-en);font-weight:700;font-size:14px;color:#fff;background:var(--green);
    width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;box-shadow:0 1px 2px #00000022;}
  .opt.ok{border-color:var(--green);background:#ecf6ee;color:#1f6b3a;font-weight:700;}
  .opt.ok::before{background:var(--green);}
  .opt.bad{border-color:var(--bad);background:#fbecea;color:#b23a2c;font-weight:700;}
  .opt.bad::before{background:var(--bad);}
  .opt.miss{border-color:var(--bad);background:#fdf0ec;color:#c0492f;font-weight:700;
    background-image:repeating-linear-gradient(45deg,#fbecea 0 7px,#fdf0ec 7px 14px);}
  .opt.miss::before{background:var(--bad);}
  .opt.dim{opacity:.5;}
  .opt:disabled{cursor:default;}

  .dontknow{width:calc(100% - 32px);margin:13px 16px 0;background:#fffaf0;border:2px dashed var(--orange);border-radius:13px;
    padding:13px;font-size:14px;color:var(--orange);cursor:pointer;font-weight:700;letter-spacing:.5px;}
  .dontknow:active{background:#fff3e2;}

  .reveal{margin:13px 16px 0;padding:14px 16px;background:#f4f8ef;border:2px solid var(--line);
    border-radius:14px 6px 14px 6px/6px 14px 6px 14px;font-size:14px;line-height:1.65;position:relative;}
  .reveal .rt{font-weight:800;color:var(--green-deep);margin-bottom:5px;font-size:15px;}
  .reveal .rt.bad{color:var(--bad);}
  .reveal .rm{font-size:15.5px;}
  .reveal .rn{color:var(--ink-soft);font-size:13px;margin-top:7px;font-family:var(--hand-en);letter-spacing:.5px;}
  mark{background:linear-gradient(transparent 52%, var(--hl) 52%);color:inherit;padding:0 3px;border-radius:2px;font-weight:700;}

  .nextrow{display:flex;gap:10px;margin:15px 16px 6px;}
  .btn{flex:1;border:none;border-radius:14px 5px 14px 5px/5px 14px 5px 14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.5px;}
  .btn.primary{background:var(--green);color:#fff;box-shadow:0 3px 0 #2f7d4f;}
  .btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #2f7d4f;}
  .btn.sec{flex:0 0 44%;background:var(--card);border:2px solid var(--line);color:var(--ink);}
  .btn.sec:active{background:#4299580d;}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none;}

  /* 复习提示条 */
  .banner{margin:12px 16px;padding:12px 14px;border-radius:12px 4px 12px 4px/4px 12px 4px 12px;
    background:#fff4e2;color:#a9601f;font-size:13px;line-height:1.55;border:2px dashed var(--orange);position:relative;}

  /* 收藏列表 */
  .favitem{margin:11px 16px;padding:13px 15px;display:flex;align-items:center;gap:12px;}
  .favitem .fe{flex:1;min-width:0;}
  .favitem .fe .e{font-size:16px;font-weight:800;}
  .favitem .fe .m{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .favitem .x{color:var(--bad);font-size:20px;cursor:pointer;background:none;border:none;width:34px;height:34px;}

  .done{text-align:center;padding:30px 24px;}
  .done .em{font-size:50px;}
  .done h2{font-size:22px;margin:10px 0 4px;font-weight:900;}
  .done p{color:var(--ink-soft);font-size:14px;margin:5px 0 16px;font-family:var(--hand-en);letter-spacing:.5px;}
  .center-note{text-align:center;color:var(--ink-soft);padding:40px 24px;font-size:14px;line-height:1.7;}
  .reset{margin:18px 16px;font-size:12px;color:#aeb6a4;text-align:center;cursor:pointer;font-family:var(--hand-en);letter-spacing:1px;}
  .reset:active{color:var(--bad);}

  .spacer{height:22px;}

  /* ================= v2：布局稳定 / 首页 / 复习 ================= */
  /* 学习&复习页：视口固定高度，滚动只发生在 .scroll 内，底栏永远不动 */
  #app.sess{height:100vh;height:100dvh;min-height:0;overflow:hidden;}
  #app.sess .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .footbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1.5px dashed var(--line);}
  .footbar .btn{margin:0;height:54px;display:flex;align-items:center;justify-content:center;padding:0 12px;}
  .footbar .btn.rv-wrong{border-color:#e2a79c;color:var(--bad);}
  /* 「记错了」已改判 / 「不会」已记下时，用状态条占位，底栏不跳动 */
  .footbar .rvflag{flex:0 0 44%;height:54px;box-sizing:border-box;display:flex;align-items:center;
    justify-content:center;text-align:center;padding:0 8px;font-size:12.5px;font-weight:800;
    color:var(--bad);background:#fdf1ee;border:2px dashed #e2a79c;
    border-radius:14px 5px 14px 5px/5px 14px 5px 14px;line-height:1.35;}
  /* 背新词：「我选不会」移进底栏，与下一题/完成同一行 */
  .footbar .btn.miss{flex:0 0 42%;background:#fffaf0;border:2px dashed var(--orange);
    color:var(--orange);font-size:14px;font-weight:800;}
  .footbar .btn.miss:active{background:#fff3e2;}
  .footbar .btn.miss:disabled{opacity:.42;cursor:default;background:#fffaf0;}
  /* 「上一页」改判态：保持原判 / 改成记错了 */
  .footbar .btn.keep{flex:1;}
  .footbar .btn.danger{flex:1;border-color:#e2a79c;background:#fdf1ee;color:var(--bad);font-weight:800;}
  .footbar .btn.danger:active{background:#fbe4df;}
  /* topbar 右上角「撤回」 */
  .topbar .undo{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--green-deep);
    font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:18px;cursor:pointer;white-space:nowrap;}
  .topbar .undo:active{background:#42995810;}
  .topbar .undo:disabled{opacity:.35;cursor:default;}
  /* 提示态与按钮态占用同一高度，底栏位置恒定 */
  .footnote{flex:1;height:54px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:12px;color:var(--ink-soft);font-family:var(--hand-en);letter-spacing:.4px;}

  /* 固定槽位：选项 / 判断 / 释义都在同一区域内就地替换，不新增占位行 */
  .slot{margin:11px 16px 0;min-height:320px;display:flex;flex-direction:column;justify-content:center;}
  .slot > .opt{margin:0 0 9px;}
  .slot > .answerbar,.slot > .defbox,.slot > .judgerow{margin:3px 0 0;}
  /* 揭晓答案后释义框上移，紧跟单词卡，别沉在页面中下部（纯视觉位移，不改文档流） */
  .slot > .defbox{transform:translateY(-44px);}
  /* 记错强化选择题：单词卡压缩、选项区顶部对齐，4 个选项首屏可见，不用滑动 */
  .wordcard.compact{min-height:100px;margin:8px 16px 0;padding:14px 20px 12px;}
  .wordcard.compact .kicker{font-size:12px;letter-spacing:1.5px;}
  .wordcard.compact .en{font-size:26px;margin:2px 0;}
  .wordcard.compact .en.m{font-size:21px;}
  .wordcard.compact .en.l{font-size:17px;}
  .wordcard.compact .ph{font-size:12.5px;margin-bottom:0;}
  .wordcard.compact .illcorner{width:40px;height:52px;right:12px;bottom:10px;}

  .answerbar .lbl{font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;font-family:var(--hand-en);letter-spacing:1px;}
  .answerbar .val{font-weight:800;font-size:15.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .answerbar .st{margin-left:auto;font-size:12.5px;font-weight:800;flex:0 0 auto;}
  .answerbar .st.ok{color:var(--green-deep);}
  .answerbar .st.bad{color:var(--bad);}
  .wordcard{min-height:168px;}

  .judge:active{transform:translateY(1px);}
  .judge.yes{border-color:var(--green);color:var(--green-deep);background:#f0f8f1;}
  .judge.no{border-color:#e2a79c;color:var(--bad);background:#fdf4f1;}
  .judge:disabled{opacity:.42;cursor:default;transform:none;}
  .judge small{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:6px;}
  .defbox{background:var(--card);border:2px solid var(--line);border-radius:14px 6px 14px 6px/6px 14px 6px 14px;

  .defbox .zh{font-size:24px;font-weight:800;line-height:1.4;margin:6px 0 4px;}
  .defbox .tip{font-size:12.5px;color:var(--ink-soft);font-family:var(--hand-en);}
  .defbox .rst{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:20px;
    background:#ecf6ee;color:var(--green-deep);}
  .defbox .rst.bad{background:#fbecea;color:var(--bad);}
  .rvstat{margin:8px 16px 0;font-size:12px;color:var(--ink-soft);font-family:var(--hand-en);letter-spacing:.5px;}
  .rvstat b{color:var(--orange);}

  /* —— 首页：简洁留白 —— */
  #app.home{background-color:#F9FBF6;}
  .homebg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .homebg .wash{position:absolute;right:-120px;top:-110px;width:340px;height:340px;border-radius:50%;background:#e8f2e6;opacity:.55;}
  .homebg .wash2{position:absolute;left:-90px;bottom:-70px;width:260px;height:260px;border-radius:50%;background:#fbeedd;opacity:.4;}
  .homebg .bgill{position:absolute;color:var(--green);opacity:.13;}
  .homebg .bgill.a{width:110px;height:170px;left:-24px;top:120px;transform:rotate(-12deg);}
  .homebg .bgill.b{width:120px;height:120px;right:-18px;bottom:110px;transform:rotate(14deg);color:var(--orange);opacity:.12;}
  .homebg .bgill.c{width:96px;height:96px;right:26px;top:210px;opacity:.1;}
  .homebg .bggrid{position:absolute;inset:0;background-image:radial-gradient(#7a9a7a22 1px,transparent 1px);
    background-size:22px 22px;opacity:.5;}

  .hometop{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .htag{font-family:var(--hand-en);font-size:13px;letter-spacing:2.5px;color:var(--green-deep);font-weight:700;}
  .pickbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:12.5px;font-weight:700;
    padding:8px 13px;border-radius:20px;cursor:pointer;box-shadow:0 2px 0 #00000008;}

  .hkick{font-family:var(--hand-en);font-size:15px;letter-spacing:4px;color:var(--orange);font-weight:700;}

  .hhero .cur i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
  .quotecard{margin:26px 0 0;padding:22px 20px 18px;min-height:132px;display:flex;flex-direction:column;justify-content:center;}

  .quotecard .by{font-family:var(--hand-en);font-size:12.5px;color:var(--green-deep);margin-top:8px;text-align:right;}
  .bigbtns{display:flex;flex-direction:column;gap:12px;margin-top:22px;}
  .bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    border:2px solid var(--line);border-radius:16px 6px 16px 6px/6px 16px 6px 16px;padding:16px 18px;background:var(--card);}

  .bigbtn .ic{width:44px;height:44px;flex:0 0 auto;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:#eaf4ea;color:var(--green-deep);}

  .bigbtn .t1{display:block;font-size:17px;font-weight:800;}

/* ============ 状态（localStorage 持久化，两本书独立） ============ */
const STORE_KEY = "bioFlashcardsState_v1";
const CELL_LIB_VER = 2;   // 细胞生物学词库版本
let state = loadState();
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && s.cell && s.bio){
      // 词库整体替换后，旧 cell 词条 id 会错位：只清空细胞进度，生化原样保留
      if(s.cellVer !== CELL_LIB_VER){
        s.cell = {p:{}};
        s.cellVer = CELL_LIB_VER;
        localStorage.setItem(STORE_KEY, JSON.stringify(s));
      }
      return s;
    }
  }catch(e){}
  return { cell:{p:{}}, bio:{p:{}}, cellVer:CELL_LIB_VER };
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
/* 当前词书：记住上次选择，不主动重选就一直沿用 */
if(state.curBook!=="cell" && state.curBook!=="bio"){ state.curBook="cell"; saveState(); }
function curBook(){ return DATA[state.curBook] ? state.curBook : "cell"; }

/* 旧版本把「背新词答错」写成当天到期，会让今天刚学的词当天就进复习。
   升级时只顺延「今天刚学、却被排在今天或更早」的记录；
   往日到期该复习的记录原样保留，逾期累加不能丢。 */
function migrateSameDayDue(){
  const t = today();
  let n = 0;
  for(const bid of ["cell","bio"]){
    if(!state[bid] || !state[bid].p) continue;
    for(const id in state[bid].p){
      const p = state[bid].p[id];
      if(!p || p.ddue==null || p.ddue>t) continue;
      if(!p.last || dayOf(p.last)!==t) continue;
      p.ddue = t+1; n++;
    }
  }
  if(n) saveState();
}
migrateSameDayDue();

/* 为每个 term 生成稳定 id */
function buildIndex(){
  for(const bid in DATA){
    DATA[bid]._terms = [];
    DATA[bid].chapters.forEach((ch,ci)=>{
      ch.terms.forEach((t,ti)=>{
        t._id = bid+"_"+ci+"_"+ti;
        t._bid = bid; t._ch = ch.name;
        DATA[bid]._terms.push(t);
      });
    });
  }
}
buildIndex();

/* ---------- 按天调度（艾宾浩斯） ---------- */
function dayOf(ms){ if(!ms) return -1; const d=new Date(ms); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
function today(){ return dayOf(Date.now()); }
function INTERVAL(box){ const t=[1,2,4,7,15,30]; return (box>=0&&box<t.length)? t[box] : 30; } // 天
function getP(bid,id){
  return state[bid].p[id] || {c:0,w:0,box:0,due:0,fav:false,last:0,streak:0,wrong:false,lastWrong:0};
}
function saveP(bid,id,p){ state[bid].p[id]=p; saveState(); }

/* 作答记录：当天学 / 复习过的词最早明天才回来，绝不在同一天重复安排复习。
   答对按艾宾浩斯 1/2/4/7/15/30 天逐级拉长（先按当前等级定下次日期，再升级）；
   答错等级归零，明天重来。复习里「记错了」的循环由会话队列负责，不靠 ddue。 */
function record(bid,id,correct){
  const p = getP(bid,id);
  p.seen = true; p.last = Date.now();
  if(correct){
    p.c++; p.streak = (p.streak||0)+1;
    if(p.wrong && p.streak>=2) p.wrong = false;      // 连对 2 次毕业
    p.ddue = today() + INTERVAL(p.box);              // 首次答对 = 明天（第 1 天）
    p.box = Math.min(p.box+1,5);
  } else {
    p.w++; p.box = 0; p.streak = 0; p.wrong = true; p.lastWrong = Date.now();
    p.ddue = today()+1;                              // 答错也次日再来，不当天
  }
  saveP(bid,id,p);
}
/* 复习通过：会 → 交给遗忘曲线拉长间隔；不会 → 明天再来（都不当天重复） */
function reviewPass(bid,id,know){
  if(know){ record(bid,id,true); return; }
  const p=getP(bid,id);
  p.seen=true; p.w++; p.box=0; p.streak=0; p.wrong=true; p.last=Date.now();
  p.ddue = today()+1;
  saveP(bid,id,p);
}
/* 记错了：等级清零，本轮不安排到期，等循环巩固后再交给遗忘曲线 */
function reviewMissReset(bid,id){
  const p=getP(bid,id); p.box=0; p.streak=0; p.wrong=true; saveP(bid,id,p);
}
/* 今日该复习的词：学过的 + 已到期（ddue<=今天）。
   到期日不自动推进，所以昨天没复习的原样累加进来，不丢失、不重置。
   今天刚学 / 刚复习的词 ddue 至少是明天，因此不会出现在当天队列里。 */
function dueIds(bid){
  const t=today();
  const arr=DATA[bid]._terms.filter(x=>{
    const p=getP(bid,x._id);
    if((p.c+p.w)<=0) return false;                 // 没学过的新词绝不进复习
    if(p.ddue==null) return dayOf(p.last) < t;     // 旧格式进度：只有往日学的才算到期
    return p.ddue<=t;
  });
  arr.sort((a,b)=>{
    const pa=getP(bid,a._id), pb=getP(bid,b._id);
    return (pa.ddue==null?t:pa.ddue)-(pb.ddue==null?t:pb.ddue);
  });
  return arr.map(x=>x._id);
}
function overdueCount(bid){
  const t=today();
  return dueIds(bid).filter(id=>{ const p=getP(bid,id); return p.ddue!=null && p.ddue<t; }).length;
}
function isMastered(bid,id){ const p=getP(bid,id); return (p.c||0)>0 && !p.wrong; }
function pendingIds(bid){ return DATA[bid]._terms.filter(t=>!isMastered(bid,t._id)).map(t=>t._id); }
function wrongIds(bid){ return DATA[bid]._terms.filter(t=>getP(bid,t._id).wrong).map(t=>t._id); }
function wrongStat(bid){
  let n=0, weak=0;
  DATA[bid]._terms.forEach(t=>{ const p=getP(bid,t._id); if(p.wrong){ n++; if((p.streak||0)===0) weak++; } });
  return {n, weak};
}
function masteryOf(bid){
  let ans=0, tot=0;
  DATA[bid]._terms.forEach(t=>{ const p=getP(bid,t._id); if(p.c+p.w>0){ ans += p.c/(p.c+p.w); tot++; } });
  return tot? Math.round(ans/tot*100) : 0;
}
function favIds(bid){ return DATA[bid]._terms.filter(t=>getP(bid,t._id).fav).map(t=>t._id); }

/* ============ 工具 ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const NOTES = {"细胞生物学":"从显微、亚显微到分子水平研究细胞结构与生命活动规律的学科，20 世纪随电镜和分子生物学兴起成为独立分支。","细胞学说":"1838—1839 年施莱登、施旺提出：一切动植物由细胞构成，细胞是结构与功能基本单位；1858 年魏尔肖补上「细胞只能来自细胞」。","原核细胞":"无核膜包围的成形细胞核，也没有膜性细胞器，环状 DNA 集中在类核；细菌与蓝藻是代表，直径多 1—10 μm。","真核细胞":"有核膜包围的细胞核与内质网、线粒体等膜性细胞器，靠内膜系统和细胞骨架把不同反应分隔在不同区域。","病毒":"非细胞形态的专性胞内寄生体，只带一种核酸外加蛋白衣壳，离开宿主不能复制，也不具备独立代谢系统。","超微结构":"光镜分辨不出、需电镜才能看见的亚细胞构造，如膜的双层、核糖体、微管等，又称亚显微结构。","质粒":"细菌染色体外能自主复制的小型环状 DNA，常携带抗药基因，是基因工程最常用的载体之一。","类核":"原核细胞内 DNA 高度折叠集中的区域，无核膜包围，常附着于质膜内侧面，功能上相当于拟核。","支原体":"已知最小、能独立生活的原核生物，没有细胞壁故对青霉素不敏感，形态多变且能通过细菌滤器。","古细菌":"伍斯据 16S rRNA 序列分出的独立原核生物类群，细胞壁无肽聚糖、膜脂为醚键，多生活于高温高盐等极端环境。","朊病毒":"普鲁西纳 1982 年提出的致病性错误折叠蛋白，不含核酸，能诱导正常 PrP 变构累积，引起疯牛病与克雅氏病，获 1997 年诺奖。","原生质体":"用酶去掉细胞壁后仅由质膜包被的细胞内容物，植物与细菌常用，是细胞融合与遗传转化的好材料。","类病毒":"只由一圈单链环状 RNA 构成、连蛋白衣壳都没有的病原体，比病毒更小，主要感染植物，如马铃薯纺锤块茎病。","原生质理论":"19 世纪舒尔策等提出「细胞是一团有核的原生质」，强调生命物质本身而非细胞壁，为细胞学说铺路。","中膜体":"电镜下细菌质膜内陷形成的膜囊，曾被认为参与 DNA 复制与呼吸，现多视为化学固定造成的人为假象。","荚膜":"某些细菌细胞壁外的黏性多糖或多肽层，抗干燥、抗吞噬、助附着，也是重要抗原与毒力因子。","免疫荧光技术":"Coons 建立：把荧光素标记在抗体上，借抗原抗体反应在细胞原位定位特定蛋白，分直接法与间接法。","光脱色恢复技术":"用强激光把膜上一小块荧光淬灭，再测荧光恢复速度，据此算出膜蛋白或膜脂的侧向扩散系数，是证明膜流动性的经典实验。","细胞系":"原代培养物经第一次传代后即称细胞系，可有限传代或永生化，是体外实验最常用的细胞材料。","细胞株":"从细胞系中用克隆或筛选挑出的、具有特定性状且稳定的亚群，比细胞系更均一。","原代细胞培养":"直接从机体组织消化分散后进行的首次培养，最接近体内状态，但增殖次数有限、成分较混杂。","传代细胞培养":"原代细胞长满后按比例分种到新培养瓶继续扩增，贴壁细胞需先用胰酶消化下来。","流式细胞术":"让细胞单列高速通过激光，逐个测散射光与荧光，数秒内完成计数、分群与分选，常用于细胞周期与免疫表型分析。","模式生物":"生命周期短、易培养、遗传背景清楚的代表物种，如大肠杆菌、酵母、线虫、果蝇、小鼠、拟南芥，用来推导普遍规律。","单克隆抗体技术":"Köhler 与 Milstein 1975 年建立杂交瘤法：把免疫 B 细胞与骨髓瘤细胞融合，筛出永生且只分泌一种抗体的克隆，1984 年获诺奖。","原位杂交":"用标记的核酸探针与细胞或组织切片上的互补序列杂交，在不破坏形态的前提下定位特定 DNA/RNA 的表达位置。","荧光共振能量转移技术":"供体与受体荧光基团相距 1—10 nm 时发生非辐射能量转移，被用来测分子间距与蛋白互作是否发生。","细胞融合":"用灭活病毒或 PEG 诱导两个细胞合并成含双核的异核体，是杂交瘤、体细胞杂交与核移植的基础手段。","有限细胞系":"正常二倍体细胞只能传 40—60 代（Hayflick 界限）后衰老停滞，核型正常、无致瘤性。","永生细胞系":"经病毒转化、端粒酶激活或来自肿瘤而突破衰老界限、可无限传代的细胞，常伴核型异常，如 HeLa、CHO。","接触抑制":"正常贴壁细胞长成单层、彼此接触后便停止迁移与分裂；癌细胞常丧失此特性，可多层堆叠生长。","负染色技术":"用磷钨酸等重金属盐把背景染黑、样品反衬成亮影，无需切片即可在电镜下看病毒、膜泡等微粒外形。","免疫电镜技术":"把胶体金或铁蛋白标在抗体上，在电镜分辨率下把抗原精确定位到某一膜层或细胞器，兼得特异性与超微定位。","酵母双杂交技术":"Fields 与 Song 1989 年建立：诱饵与猎物蛋白分别接转录因子的结合域和激活域，两者互作则报告基因被激活，用于筛互作蛋白。","放射自显影技术":"用³H、¹⁴C 等同位素标记前体掺入细胞，再覆感光乳胶，凭银粒位置追踪大分子合成与运输的时间过程。","密度梯度离心":"在离心管中铺蔗糖或氯化铯梯度，样品按沉降系数或浮力密度分层，用于分离细胞器、病毒与大分子。","速度沉降":"依据颗粒大小形状造成的沉降速度差异分离，需在沉到底前停止，适合分离大小差别明显的细胞器。","等密度沉降":"让颗粒停在自身浮力密度与介质相等的位置，与时间无关，可分开密度不同的 DNA、膜片与病毒。","相差显微镜":"Zernike 1930 年代发明，把透过活细胞的光程差转成振幅差，无需染色即可观察活细胞与有丝分裂，获 1953 年诺奖。","细胞培养":"在体外无菌、恒温、合适培养基条件下维持或扩增细胞的技术，是现代细胞生物学与生物制品生产的基础。","荧光显微镜":"用特定波长激发样品中的荧光素或荧光蛋白，滤去激发光只留发射光成像，可做多色标记定位。","细胞克隆":"由单个细胞增殖而成的遗传均一群体，用于建立细胞株、验证单细胞全能性与药物筛选。","免疫印迹":"先 SDS-PAGE 分离蛋白、转膜，再用特异抗体加酶标二抗显色，可判定目标蛋白有无及分子量大小。","酶联免疫吸附测定":"把抗原或抗体固定在微孔板上，经酶标二抗催化底物显色，用吸光度定量，是临床检测抗原抗体的常用方法。","激光扫描共焦显微镜":"用针孔滤掉焦外光，逐点扫描做光学切片，可重建细胞三维结构，清晰度明显高于普通荧光显微镜。","杂交瘤技术":"把产特定抗体的 B 淋巴细胞与可无限增殖的骨髓瘤细胞融合，经 HAT 筛选得到既永生又分泌单抗的细胞株。","分辨率":"显微镜能区分两点的最小距离，约 0.61λ/NA；可见光受波长限制约 200 nm，电镜因电子波长极短可达亚纳米。","原生质体培养":"去壁后的植物原生质体在含渗透压稳定剂的培养基中再生壁、分裂成愈伤组织并再生成植株，是体细胞杂交基础。","细胞工程":"用细胞融合、核移植、染色体转移等手段在细胞水平改造遗传性状，代表成果是单抗、克隆动物与体细胞杂种。","扫描隧道显微镜":"Binnig 与 Rohrer 1981 年发明，靠探针与导电样品间的隧道电流成像，可达原子级分辨率，1986 年获诺奖。","RNA干扰":"Fire 与 Mello 1998 年在线虫发现：双链 RNA 被切成 siRNA，引导 RISC 降解互补 mRNA 而特异沉默基因，2006 年获诺奖。","荧光原位杂交":"用荧光标记探针与染色体或细胞内 DNA/RNA 杂交，直接显示基因位置、染色体数目异常与融合基因。","细胞贴壁":"多数正常组织来源细胞需附着于带电荷表面并铺展才能增殖，称贴壁依赖；丧失该依赖常是恶性转化标志。","显微操作技术":"在显微镜下用微吸管、微针完成核移植、显微注射、单细胞分离，是克隆动物与转基因动物的关键。","单克隆抗体":"由单一 B 细胞克隆产生的、只识别一个抗原表位的高度均一抗体，特异性强、可大量制备，广泛用于诊断与靶向治疗。","蛋白质芯片":"把大量蛋白或抗体按阵列固定于玻片，一次并行检测上百种互作、表达或修饰，属高通量蛋白组学技术。","绿色荧光蛋白":"从维多利亚多管水母克隆的 238 氨基酸蛋白，无需底物即自发绿色荧光；下村修、Chalfie、钱永健获 2008 年诺奖。","基因敲除":"通过同源重组或 CRISPR 使目标基因彻底失活，从表型反推基因功能；Capecchi、Evans、Smithies 获 2007 年诺奖。","基因打靶":"把外源 DNA 定向导入基因组特定位点并发生同源重组，可精确做敲除、敲入或点突变，是构建模型动物的核心。","非细胞体系":"把细胞破碎后保留有功能的组分，在试管中重现翻译、膜泡运输或核装配，便于加药精确操控。","单层细胞":"贴壁细胞长满后形成的一层细胞，因接触抑制不再重叠，常用于病毒空斑测定与跨上皮转运实验。","色谱技术":"利用样品在固定相与流动相间分配差异分离，分离子交换、凝胶过滤、亲和与反相色谱，是蛋白纯化主力。","单分子技术":"用光镊、磁镊、全内反射荧光观察单个分子的运动与反应，能揭示群体平均所掩盖的异质性与步进机制。","免疫细胞化学技术":"用标记抗体在保持形态的细胞或组织切片上显示抗原位置，配合酶显色可在普通光镜下定位蛋白。","组织培养":"把小块组织或器官在体外维持其三维结构与分化状态培养，比分散细胞更接近体内微环境。","原代细胞":"刚从组织分离、尚未传代的细胞，保留较多体内特性，是药理与毒理实验最贴近生理的模型。","电子显微镜":"Ruska 1931 年研制，用电子束代替可见光、电磁透镜成像，分辨率达亚纳米，分透射电镜与扫描电镜两类。","同核体":"同一物种或相同基因型细胞融合形成的含多个相同细胞核的多核细胞，与异核体相对。","多克隆抗体":"用抗原免疫动物后从血清获得的、针对多个表位的多种抗体混合物，制备快、信号强但批间差异大。","小干扰RNA":"21—23 nt 的双链 RNA，由 Dicer 产生并装入 RISC，按碱基互补引导切割靶 mRNA，是 RNAi 的效应分子。","扫描电镜":"用细电子束逐点扫描样品表面、收集二次电子成像，景深大、立体感强，专看细胞与组织表面形貌。","冷冻蚀刻技术":"样品速冻后断裂、升华蚀刻并喷铂碳复型，在电镜下看膜内部断裂面，是证明膜蛋白镶嵌于脂双层的关键证据。","杂交瘤":"B 细胞与骨髓瘤细胞融合成的杂种细胞，兼具永生增殖与分泌特异抗体的能力，是单抗生产的工厂。","荧光蛋白":"一类自身可发荧光的蛋白（GFP 及红、黄、青变体），可与目的蛋白融合表达，用于活细胞实时示踪。","原子力显微镜":"用微悬臂探针感受针尖与样品间原子力并扫描成像，不要求导电、可在液体中工作，能测活细胞力学性质。","生物膜":"细胞所有膜结构的统称，以磷脂双分子层为骨架、镶嵌蛋白与糖类，厚约 6—10 nm，承担分隔、转运与信号转换。","单位膜":"Robertson 1959 年据电镜提出「暗—明—暗」三层模型，认为所有膜共厚约 7.5 nm，是流动镶嵌模型的前身。","膜整合蛋白":"部分或全部插入脂双层、需用去垢剂才能洗下的膜蛋白，多含跨膜 α 螺旋，担当通道、泵与受体。","脂筏模型":"Simons 与 Ikonen 1997 年提出：膜上富含胆固醇与鞘脂的动态有序微区像筏子聚集信号分子，参与分选与信号转导。","膜骨架":"质膜胞质面由血影蛋白、肌动蛋白等组成的纤维网，支撑膜形状并固定膜蛋白，红细胞血影最典型。","流动镶嵌模型":"Singer 与 Nicolson 1972 年提出：膜是流动的脂双层，蛋白以镶嵌或附着方式分布并可侧向扩散，是目前公认的膜结构模型。","细胞质膜":"包围细胞的一层单位膜，厚约 7—8 nm，选择通透、接收信号、介导识别与黏着，是细胞与环境的界面。","脂锚定膜蛋白":"蛋白本身不跨膜，靠共价连接的脂肪酸或 GPI 锚插在膜上，位于膜外或内侧，易被磷脂酶释放。","去垢剂":"兼有亲水头与疏水尾的两性小分子，超过临界浓度后插入膜并把膜蛋白增溶下来，Triton、SDS 常用于裂解。","脂质体":"磷脂在水中自组装成的封闭双分子层小球，内可包药物、表面可接抗体，是经典膜模型与药物载体。","外在膜蛋白":"靠静电或氢键附着在膜表面、不插入疏水核心，用高盐或碳酸盐即可洗脱，如血影蛋白、锚蛋白。","成斑现象":"用二价抗体交联膜上抗原，原本分散的蛋白先聚成斑、再成帽，是证明膜蛋白可侧向移动的经典实验。","红细胞血影":"红细胞低渗溶血后血红蛋白逸出、只剩质膜与膜骨架的空壳，是研究膜蛋白组成与膜骨架的经典材料。","血影蛋白":"红细胞膜骨架主成分，α/β 亚基组成细长异二聚体并连成网格，缺陷导致遗传性球形红细胞增多症。","带3蛋白":"红细胞膜上最丰富的跨膜蛋白，作 Cl⁻/HCO₃⁻ 交换体参与 CO₂ 运输，同时把膜骨架锚定到膜上。","磷脂":"甘油或鞘氨醇接两条疏水尾与含磷酸极性头，在水中自发成双分子层或脂质体，是生物膜的骨架；卵磷脂、脑磷脂属甘油磷脂。","微团临界浓度":"去垢剂或脂类开始自聚集形成微团的最低浓度，超过后单体浓度基本不变，是选用去垢剂用量的依据。","带4.1蛋白":"红细胞膜骨架成分，连接血影蛋白-肌动蛋白网络与血型糖蛋白以稳定形态，缺陷引起椭圆形红细胞症。","孔蛋白":"线粒体外膜、叶绿体外膜与细菌外膜上的 β 桶状通道，允许分子量小于约 5000 Da 的溶质自由通过。","血型糖蛋白":"红细胞膜上富含唾液酸的单次跨膜糖蛋白，带大量负电荷使红细胞互斥，并携带 MN 血型抗原。","胆固醇":"动物细胞膜中最主要的甾醇，羟基朝膜面、刚性环插在脂链间双向缓冲流动性；也是合成甾体激素、胆汁酸与维生素 D 的前体。","膜的流动性":"膜脂与膜蛋白可侧向扩散、旋转与翻转的性质，受温度、不饱和度、链长与胆固醇调节，是转运与信号传递的前提。","简单扩散":"小分子顺浓度梯度直接溶入并穿过脂双层，不需蛋白也不耗能，速度取决于脂溶性与大小，如 O₂、CO₂。","协助扩散":"顺电化学梯度、不耗 ATP，但须借载体或通道蛋白，有饱和性与特异性，如葡萄糖经 GLUT 入胞。","被动运输":"简单扩散与协助扩散合称，动力来自浓度或电化学梯度本身，不直接消耗代谢能，最终趋于平衡。","主动运输":"逆浓度或电化学梯度搬运，须偶联 ATP 水解、离子梯度或光能，由泵与协同转运蛋白完成，可建立离子差。","ATP驱动泵":"直接水解 ATP 获取能量转运离子的跨膜蛋白，分 P 型、V 型、F 型与 ABC 四大类。","胞吞作用":"质膜内陷把胞外物质包入囊泡运进细胞，分吞噬、胞饮与受体介导三类，需肌动蛋白与发动蛋白参与。","胞吐作用":"胞内囊泡与质膜融合，把分泌物排出并补上膜面积，分组成型与调节型，依赖 SNARE 配对与 Ca²⁺ 触发。","P型泵":"转运中形成天冬氨酰磷酸化中间体的阳离子泵，如 Na⁺-K⁺ 泵、Ca²⁺ 泵，可被钒酸盐抑制。","载体蛋白":"与溶质特异结合后经构象改变把其转到膜另一侧，有饱和动力学与竞争抑制，既可被动也可主动。","协同转运蛋白":"同时转运两种溶质，用一种顺梯度的势能把另一种逆梯度带过去，分同向与反向。","离子通道":"形成亲水孔道的跨膜蛋白，每秒可通过上千万离子，多具电压、配体或机械门控与离子选择性。","吞噬作用":"细胞伸伪足包围大颗粒或细菌形成吞噬体，再与溶酶体融合消化，是巨噬细胞、中性粒细胞的防御手段。","胞饮作用":"质膜内陷吞入少量胞外液与小溶质成小囊泡，连续发生、选择性低，是摄取液相物质的方式。","Na+-K+泵":"Skou 1957 年发现：每水解 1 ATP 泵出 3 Na⁺、泵入 2 K⁺，建立静息电位与渗透压，是 P 型泵代表，1997 年获诺奖。","协同转运":"一种溶质顺梯度下行时驱动另一种逆梯度上行，能量间接来自泵预先建立的离子梯度，故称继发性主动运输。","ABC超家族":"含 ATP 结合盒结构域的一大类转运蛋白，靠 ATP 结合水解转运脂质、离子与药物；MDR1、CFTR 属此族。","Ca2+泵":"质膜与肌质网上的 P 型 ATP 酶，把 Ca²⁺ 泵出胞质或泵入钙库，维持胞质游离钙约 10⁻⁷ mol/L 的低本底。","组成型胞吐途径":"TGN 出芽囊泡持续运到质膜融合，用于补充膜脂膜蛋白、分泌胶原与血清蛋白，不需额外信号。","调节型胞吐途径":"分泌物先储于分泌颗粒，只在激素或神经信号引起 Ca²⁺ 升高时才融合释放，如胰岛素与神经递质。","V型质子泵":"溶酶体、胞内体与液泡膜上的 ATP 驱动质子泵，把 H⁺ 泵入腔内酸化，不形成磷酸化中间体。","F型质子泵":"线粒体内膜、类囊体膜上的 ATP 合酶，正常时让 H⁺ 顺梯度回流并合成 ATP，又称 F₀F₁-ATP 酶。","通道蛋白":"跨膜形成亲水通道，不与被运物结合、无饱和现象、速度远快于载体，多数带门控。","动作电位":"可兴奋细胞受阈上刺激后膜电位快速去极化再复极化的一次波动，由电压门控 Na⁺、K⁺ 通道依次开放产生。","膜电位":"质膜两侧因离子分布不均形成的电位差，静息时内负外正，是神经传导、肌肉收缩与主动运输的基础。","静息电位":"未受刺激时膜两侧电位差，主要由 K⁺ 外流与 Na⁺-K⁺ 泵维持，神经元约 −70 mV。","膜转运蛋白":"载体蛋白与通道蛋白统称，把不能自由穿过脂双层的离子、糖、氨基酸等有选择地运过膜。","跨细胞转运":"物质在一侧胞吞、以囊泡穿过细胞、再在另一侧胞吐，如母体 IgG 经上皮进入胎儿血。","水孔蛋白":"Agre 发现、2003 年获诺奖的跨膜水通道，四聚体每亚基一孔，让水快速通过而阻挡质子；肾 AQP2 受抗利尿激素调控。","同向转运":"协同转运的一种，两种溶质朝同一方向过膜，如小肠借钠梯度用 SGLT 吸收葡萄糖。","胞膜窖":"质膜上富含胆固醇与 caveolin 的瓶状内陷微区，参与胞吞、胆固醇稳态与信号分子聚集，与脂筏关系密切。","胞内体":"胞吞囊泡入胞后首先到达的分选站，腔内 pH 渐降，决定受体回收、配体降解或运往溶酶体。","受体介导的胞吞作用":"配体先结合质膜受体、聚入网格蛋白有被小窝再内吞，高效且特异；LDL 与转铁蛋白即走此路，Brown 与 Goldstein 获 1985 年诺奖。","GLUT":"12 次跨膜的协助扩散载体家族；GLUT4 受胰岛素调控转位到膜上，GLUT2 在肝与胰岛 β 细胞。","膜泡运输":"细胞器间以出芽—转运—锚定—融合方式运送蛋白脂质，由 COPⅡ、COPⅠ、网格蛋白与 Rab、SNARE 保证方向特异。","同向协同转运蛋白":"即同向转运体，把驱动离子与被运底物同向带过膜，能量来自钠或质子梯度。","质子泵":"把 H⁺ 逆梯度跨膜搬运的蛋白，含 P 型、V 型、F 型与光驱动泵，用于酸化细胞器、建立质子动力势。","光驱动泵":"直接吸光能转运离子的膜蛋白，典型是嗜盐菌细菌视紫红质，光照把 H⁺ 泵出胞外形成梯度再产 ATP。","细胞内膜系统":"核膜、内质网、高尔基体、溶酶体、胞内体与囊泡等结构上相互连通、靠膜泡交换物质的膜性细胞器总称。","N-连接的糖基化":"内质网中把预装配寡糖整体转到 Asn-X-Ser/Thr 的天冬酰胺氨基上，再经高尔基体修剪，是分泌蛋白最常见修饰。","O-连接的糖基化":"高尔基体中把单糖逐个加到 Ser/Thr 羟基上，不经多萜醇载体，常见于黏蛋白与蛋白聚糖。","过氧化物酶体":"de Duve 1965 年发现：含 40 余种氧化酶的单层膜细胞器，分解超长链脂肪酸并借过氧化氢酶清除 H₂O₂，缺陷致 Zellweger 综合征。","分子伴侣":"帮助新生肽链正确折叠、防止聚集、协助跨膜的一类蛋白，多属热休克蛋白，需 ATP，不成为成品组分。","细胞质基质":"质膜内除细胞器外的无定形胶状物，含大量酶、核糖体与骨架，是糖酵解、蛋白合成与信号反应场所。","蛋白酶体":"26S 桶状多亚基蛋白酶，识别多聚泛素链后解折叠并切成短肽，负责清除错误折叠与短寿命调控蛋白，2004 年获诺奖。","内质网应激反应":"未折叠蛋白在内质网堆积触发的未折叠蛋白响应，经 IRE1、PERK、ATF6 暂停翻译、上调伴侣，过强则诱导凋亡。","泛素依赖性降解途径":"底物经 E1/E2/E3 级联连上多聚泛素链，再由 26S 蛋白酶体识别降解，是选择性清除蛋白的主通路，需 ATP。","糖基化（包括蛋白质糖基化）":"在酶催化下把糖链共价接到蛋白或脂质上，影响折叠、定位、稳定性与细胞识别，主要在内质网和高尔基体完成。","溶酶体":"de Duve 1955 年发现：单层膜、腔内 pH 约 5、含 60 余种酸性水解酶，负责细胞内消化、自噬与受体下调，1974 年获诺奖。","初级溶酶体":"刚从 TGN 出芽、只含水解酶尚未与底物融合的溶酶体，体积小、内容物均一。","次级溶酶体":"初级溶酶体与吞噬体或自噬体融合后正在消化底物的溶酶体，内含形态多样的残余物。","残质体":"消化完成后残留无法降解物质（如脂褐素）形成的小体，可长期滞留胞内或经胞吐排出。","自噬作用":"大隅良典因阐明机制获 2016 年诺奖：双层膜包裹受损细胞器成自噬体，与溶酶体融合降解，饥饿时回收原料维持稳态。","糙面内质网":"胞质面附着核糖体的扁平囊，合成分泌蛋白、膜蛋白与溶酶体蛋白，并进行 N-糖基化与二硫键形成。","滑面内质网":"无核糖体的管状膜网，负责脂质与甾体合成、药物解毒、Ca²⁺ 储存释放，肌细胞中特化为肌质网。","自噬溶酶体":"自噬体与溶酶体融合后的结构，包裹物在此被水解酶降解，产物回输胞质再利用。","异噬溶酶体":"溶酶体与吞噬体或胞饮泡融合、消化外来源物质所形成，与自噬溶酶体相对。","反面高尔基网状结构":"高尔基体反面管网，是蛋白分选最后一站：按去向打包进分泌颗粒、溶酶体酶囊泡或组成型囊泡。","高尔基体中间膜囊":"位于顺面与反面之间的数层扁平囊，进行糖链修剪与追加、硫酸化等加工，是糖蛋白成熟主要场所。","泛素化":"E1 活化、E2 结合、E3 连接酶把泛素共价连到底物赖氨酸上的过程，可标记降解，也可作非降解型信号。","泛素":"76 个氨基酸组成、序列高度保守的小蛋白，C 端甘氨酸与底物赖氨酸成异肽键，多聚链是蛋白酶体降解标签。","内质网":"Porter 等 1945 年电镜发现的由单层膜围成的管囊网络，与核膜相连，分糙面滑面，是蛋白脂质合成与钙储存枢纽。","内质网滞留信号":"可溶性驻留蛋白 C 端 KDEL、膜蛋白胞质端 KKXX，被 COPⅠ 受体识别后从高尔基体回收，保证不被分泌出去。","解毒作用":"滑面内质网细胞色素 P450 单加氧酶把脂溶性药物羟化再结合葡萄糖醛酸使之水溶排出，长期用药会诱导该膜增生。","乙醛酸循环体":"植物种子与酵母中特化的过氧化物酶体，含异柠檬酸裂解酶与苹果酸合酶，可把脂肪经乙醛酸循环转成糖。","热休克蛋白":"Ritossa 1962 年在果蝇发现、因热激大量表达的一类分子伴侣，分 HSP70、HSP90、HSP60 与小 HSP，帮助折叠抗应激。","信号斑":"蛋白折叠后由空间上靠拢的若干不连续序列构成的三维分选信号，指导溶酶体酶加上甘露糖-6-磷酸标签。","微粒体":"匀浆离心时破碎内质网自行封闭成的小囊泡，并非天然细胞器，却是研究蛋白转运与药物代谢的经典材料。","蛋白二硫键异构酶":"内质网腔内兼具伴侣功能的酶，催化错配二硫键断裂重排，帮分泌蛋白形成正确构象。","免疫球蛋白重链结合蛋白":"即 BiP/GRP78，内质网腔 HSP70 家族伴侣，结合未折叠重链、把肽链拉入腔内并感知应激启动 UPR。","高尔基体":"Camillo Golgi 1898 年银染发现：由顺面到反面堆叠的扁平膜囊加周围囊泡，负责糖基化加工、分选包装，被称为细胞邮局。","热激蛋白":"与热休克蛋白同义，细胞遇高温、氧化、缺氧时上调的一批伴侣蛋白，保护其他蛋白不变性聚集。","调节型分泌":"分泌物在高尔基体后浓缩储存于颗粒，只有接到信号（常为 Ca²⁺ 升高）才批量释放，见于内分泌与神经细胞。","组成型分泌":"囊泡从 TGN 生成后不与信号挂钩、持续运往质膜融合，用于更新膜成分与分泌胞外基质，所有细胞都有。","移位子":"内质网膜上由 Sec61 构成的蛋白传导通道，核糖体与之对接后新生肽链边合成边穿膜入腔或插膜。","泛素-蛋白酶体降解途径":"泛素化标记与 26S 蛋白酶体降解偶联的完整通路，调控周期蛋白、转录因子与错误折叠蛋白的半衰期。","高尔基体顺面网状结构（顺面膜囊）":"面向内质网的一侧管网，接收 COPⅡ 囊泡送来的新蛋白，并把误运的驻留蛋白经 COPⅠ 送回内质网。","I细胞病":"黏脂贮积症Ⅱ型：缺 N-乙酰葡糖胺磷酸转移酶，溶酶体酶无法加甘露糖-6-磷酸标签而被分泌到胞外，胞内出现大量包涵体。","蛋白质分选":"新生蛋白凭自带的分选信号被送到内质网、线粒体、核或过氧化物酶体等目的地，Palade 与 Blobel 等工作因此获 1974、1999 年诺奖。","信号假说":"Blobel 与 Dobberstein 1975 年提出：分泌蛋白 N 端信号肽被 SRP 识别，带核糖体一起锚到内质网膜，肽链边合成边进入腔内；Blobel 获 1999 年诺奖。","信号肽":"新生肽链 N 端 15—30 个氨基酸的疏水序列，像地址标签把蛋白引向分泌途径，进入内质网后多被信号肽酶切掉。","导肽":"线粒体、叶绿体蛋白前体 N 端的富 Arg/Ser 两亲 α 螺旋序列，指引其穿过外膜内膜，到位后被基质加工肽酶切除。","后翻译转运途径":"蛋白在胞质核糖体上先合成完毕，再由伴侣保持非折叠状态穿过膜，见于线粒体、叶绿体与过氧化物酶体。","共翻译转运途径":"肽链还在核糖体上延伸时就开始跨内质网膜转运，由 SRP 与移位子协同完成，是分泌蛋白与膜蛋白的主要入膜方式。","COPⅡ被膜小泡":"由 Sar1、Sec23/24、Sec13/31 包被，负责把正确折叠的货物从内质网运往高尔基体，是顺向运输的第一步。","COPⅠ被膜小泡":"由 ARF 与 coatomer 包被，负责高尔基体各囊间及高尔基体到内质网的逆向回收，识别 KDEL/KKXX 信号。","SRP":"由 7S RNA 与 6 个蛋白组成，结合信号肽后暂停翻译，把核糖体带到内质网膜上的 SRP 受体。","网格蛋白/接头蛋白包被膜泡":"由网格蛋白三脚架与 AP 接头蛋白包被，从质膜或 TGN 出芽，负责受体介导胞吞与溶酶体酶的分选运输。","回收信号序列":"KDEL、KKXX 等短序列，让误入高尔基体的内质网驻留蛋白被 COPⅠ 囊泡识别并送回，维持细胞器身份。","起始转移信号":"肽链中启动跨膜转运的疏水序列，被移位子识别后开始把后续肽链送入内质网腔。","STA":"跨膜肽链中的疏水段使转运中止并把蛋白锚在膜上，决定单次跨膜蛋白的方向。","SNAREs":"分 v-SNARE 与 t-SNARE，囊泡与靶膜上的螺旋束相互缠绕拉近膜并融合，是膜泡运输特异性的分子基础，相关研究获 2013 年诺奖。","衔接蛋白":"AP 家族接头蛋白，一端连网格蛋白、一端识别货物胞质尾的分选信号，决定哪些蛋白被装进包被膜泡。","网格蛋白":"由三条重链三条轻链组成的三脚架结构，聚合成多面体笼把膜拉成芽，出芽后由 Hsc70 脱被。","发动蛋白":"一种 GTP 酶，在出芽囊泡颈部聚成螺旋环，水解 GTP 后收缩把囊泡从质膜上掐断，参与胞吞。","Sar蛋白":"小 GTP 结合蛋白 Sar1，GTP 态暴露两亲螺旋插入内质网膜，招募 Sec23/24 启动 COPⅡ 包被组装。","停止转移序列":"使正在转运的肽链停止穿膜并侧向释放到脂双层的疏水序列，与起始信号配合决定多跨膜蛋白拓扑。","半自主性细胞器":"线粒体和叶绿体：有自己的 DNA、核糖体与部分蛋白合成能力，但多数蛋白仍由核基因编码、在胞质合成后运入。","ATP合酶":"嵌在内膜上的 F₀F₁ 复合体，质子经 F₀ 回流驱动 c 环与 γ 轴旋转，使 F₁ 的 β 亚基依次合成 ATP，Boyer 与 Walker 获 1997 年诺奖。","电子传递链":"位于线粒体内膜的复合体Ⅰ—Ⅳ加辅酶 Q 与细胞色素 c，按电位递增把电子交给 O₂ 生成水，同时把质子泵到膜间隙，是氧化磷酸化的上游。","内共生学说":"Margulis 系统提出：线粒体与叶绿体源自被原始真核细胞吞噬后未被消化的好氧菌与蓝藻，证据是双层膜、环状 DNA 与 70S 核糖体。","氧化磷酸化":"Mitchell 化学渗透学说的核心：呼吸链泵出的质子经 ATP 合酶回流，驱动 ADP 磷酸化成 ATP，是有氧细胞约 90% ATP 的来源，可被解偶联剂或氰化物阻断。","光合磷酸化":"Arnon 1954 年发现：类囊体膜光驱动电子传递建立质子梯度，由 ATP 合酶合成 ATP；分非循环（产 ATP+NADPH+O₂）与循环（只产 ATP）两种。","类囊体":"叶绿体内由膜围成的扁平囊，叠成基粒，膜上嵌光系统Ⅰ/Ⅱ、细胞色素 b₆f 与 ATP 合酶，腔内累积质子形成光合质子动力势。","基粒":"类囊体像硬币一样叠成的柱狀结构，极大增加受光膜面积；基粒间由基质类囊体（基质片层）相连。","光反应":"类囊体膜上光系统Ⅱ吸光裂解水放 O₂，电子经质体醌、细胞色素 b₆f、质体蓝素到光系统Ⅰ再还原 NADP⁺；同时建立质子梯度产 ATP。","卡尔文循环":"Calvin、Benson、Bassham 用¹⁴C 示踪与纸层析阐明：基质中 Rubisco 羧化 RuBP，经还原与 RuBP 再生三阶段固定 CO₂ 成糖，1961 年获诺奖。","核质互作":"核基因与细胞器基因协同表达：线粒体/叶绿体的多数亚基由核编码运入，细胞器也通过逆行信号调节核基因转录。","核质冲突":"核基因组与细胞器基因组在遗传方式、复制节奏或适配上不匹配，常见于种间杂交与细胞质雄性不育。","线粒体基质":"内膜包围的胶状腔，含三羧酸循环酶系、线粒体 DNA、核糖体与颗粒，是丙酮酸氧化与脂肪酸 β-氧化的场所。","线粒体膜间隙":"内外膜之间的窄腔，因质子泵入而富含 H⁺ 且电位较正，是形成质子动力势的关键空间，也含细胞色素 c。","线粒体内膜":"高度折叠成嵴、富含心磷脂且通透性极低，嵌着呼吸链与 ATP 合酶，靠专一载体转运代谢物。","线粒体外膜":"较平滑、含孔蛋白，允许小分子与离子自由通过，也是线粒体分裂融合与凋亡信号调控的平台。","线粒体":"Altmann 1890 年发现、Benda 命名：双层膜的动力工厂，经三羧酸循环与氧化磷酸化产 ATP，还参与钙稳态、凋亡与产热。","叶绿体":"植物与藻类细胞中含叶绿素的双层膜细胞器，类囊体上进行光反应、基质中进行碳同化，把光能转成化学能。","半自主性":"细胞器虽有自己的 DNA 与核糖体，能合成少数蛋白，但复制与多数结构仍受核基因控制，不能脱离细胞独立生存。","碳同化反应":"把 CO₂ 固定并还原成糖的过程，即卡尔文循环（暗反应），在叶绿体基质中消耗光反应生成的 ATP 与 NADPH。","原初反应":"光合作用最起始一步：天线色素吸收光子并把激发能传到反应中心叶绿素，发生电荷分离，时间尺度为皮秒级。","化学渗透学说":"Mitchell 1961 年提出：电子传递把质子泵到膜一侧，跨膜电化学梯度回流时驱动 ATP 合成，1978 年获诺奖，统一解释氧化与光合磷酸化。","C4途径":"Hatch 与 Slack 阐明：玉米、甘蔗等先在叶肉细胞由 PEP 羧化酶固定 CO₂ 成四碳酸，再运到维管束鞘脱羧浓缩 CO₂，抑制光呼吸、提高高温强光下效率。","嵴":"线粒体内膜向基质折叠形成的片状或管状突起，成倍扩大呼吸链与 ATP 合酶的装载面积，数量与细胞耗能正相关。","光合作用":"总式 6CO₂+6H₂O→C₆H₁₂O₆+6O₂：光反应在类囊体膜产 ATP/NADPH 并放氧，暗反应在基质固碳成糖；van Helmont、Priestley、Ingenhousz 等逐步揭示。","细胞呼吸":"细胞把葡萄糖等有机物逐步氧化，经糖酵解、三羧酸循环与氧化磷酸化释放能量合成 ATP，有氧时终产物为 CO₂ 与 H₂O。","微丝":"由肌动蛋白聚成的直径约 7 nm 双螺旋细丝，有极性，参与细胞运动、胞质分裂环、微绒毛支撑与肌肉收缩。","微管":"α/β 微管蛋白二聚体头尾相接成 13 根原纤维围成的中空管，直径 25 nm，有极性并具动态不稳定性，是马达蛋白轨道。","中间丝":"直径约 10 nm、无极性的绳索状纤维，由角蛋白、波形蛋白或核纤层蛋白等构成，最耐拉伸，主要给细胞提供机械强度。","细胞骨架":"微管、微丝与中间丝三套纤维网络的总称，撑起细胞形态、锚定细胞器、提供运输轨道并驱动运动与分裂。","踏车行为":"微丝或微管一端加亚基、另一端减亚基，长度不变但亚基整体向一端移动的动态现象，依赖 ATP 或 GTP 水解。","MTOC":"含 γ-微管蛋白环复合体，成核并锚定微管负端；动物细胞主要是中心体，纤毛基体也属此类。","分子马达蛋白":"把 ATP 化学能转为沿骨架定向运动的蛋白，分沿微管的驱动蛋白/动力蛋白与沿微丝的肌球蛋白三大类。","驱动蛋白":"多数朝微管正端（细胞外周）行走的马达，两条重链交替迈步，负责把囊泡、细胞器往外运，Vale 等 1985 年发现。","细胞质动力蛋白":"朝微管负端（中心体方向）行走的巨大多亚基马达，需 dynactin 辅助，负责逆向运输、高尔基体定位与有丝分裂纺锤体组装。","动力蛋白":"纤毛与鞭毛轴丝上的马达统称，含重链动力结构域，水解 ATP 使相邻微管滑动，经辐条与连接蛋白转成弯曲摆动。","肌球蛋白":"以微丝为轨道、多数朝正端运动的马达，Ⅱ型聚成粗肌丝驱动肌肉收缩，Ⅴ型负责携带囊泡短途运输。","微绒毛":"细胞表面指状突起，内部由肌动蛋白束支撑，成倍扩大吸收面积，小肠上皮刷状缘与肾小管最典型。","应力纤维":"培养细胞胞质中由肌动蛋白与肌球蛋白Ⅱ组成的粗大可收缩束，两端连黏着斑，产生张力并维持细胞铺展。","细胞皮层":"质膜下方约 0.1—0.2 μm 厚的富肌动蛋白网络，决定细胞表面张力、形态变化与胞质分裂时的力学行为。","胞质分裂环":"分裂末期在赤道板皮层由肌动蛋白与肌球蛋白Ⅱ组装的环状束，收缩产生分裂沟，最终把胞质一分为二。","马达结构域":"马达蛋白上结合 ATP 与骨架的球形头部，水解 ATP 引起构象摆动，是产生步进运动的催化核心。","肌节":"骨骼肌原纤维上相邻两条 Z 线之间的收缩单位，由粗、细肌丝规则排列成 A 带、I 带与 H 带，收缩时细肌丝向 M 线滑行。","粗肌丝":"由数百个肌球蛋白Ⅱ分子尾部聚合、头部向外突出形成，位于肌节 A 带中央，负责与细肌丝形成横桥。","细肌丝":"由双螺旋 F-肌动蛋白加原肌球蛋白与肌钙蛋白构成，一端锚于 Z 线，滑行学说中向肌节中央移动。","细胞松弛素B":"真菌代谢物，结合微丝正端阻止亚基加成，使微丝解聚，常用来抑制胞质分裂、吞噬与细胞运动。","鬼笔环肽":"来自毒鹅膏菌的环肽，特异结合并稳定 F-肌动蛋白、抑制解聚，荧光标记后是显示微丝的经典探针。","肌动蛋白":"真核细胞最丰富的蛋白，G-肌动蛋白聚成 F-肌动蛋白双螺旋，具 ATP 酶活性，构成微丝并参与肌肉收缩与细胞运动。","单体临界浓度":"肌动蛋白或微管蛋白聚合与解聚达到平衡时的游离单体浓度；正端 Cc 低、负端 Cc 高，是踏车行为的成因。","基体":"纤毛与鞭毛基部由九组三联微管构成的圆筒，由中心粒转变而来，作为轴丝微管成核与锚定的模板。","中心体":"动物细胞主要微管组织中心，含一对互相垂直的中心粒及周围粒状物质，γ-微管蛋白在此成核，分裂时形成纺锤体两极。","中心粒":"九组三联微管围成的短圆筒，成对存在且互相垂直，能自我复制并参与基体形成；精子与纤毛发生中尤其重要。","交联蛋白":"把微丝或微管横向捆成束或网络的蛋白，如 α-辅肌动蛋白、丝束蛋白、网蛋白，决定骨架的几何排布。","加帽蛋白":"结合微丝或微管末端阻止亚基加减的蛋白，用来稳定长度、控制踏车与限定纤维生长位置。","纤维切割蛋白":"如凝溶胶蛋白、丝切蛋白，能切断微丝并封住新端，快速重组骨架，参与细胞迁移与胞质分裂。","片状伪足":"细胞前缘由分支状肌动蛋白网络推出的扁平薄片状突起，是成纤维细胞与免疫细胞爬行的推进结构。","丝状伪足":"由平行肌动蛋白束支撑的细长指状突起，像探针一样探测胞外环境与导向信号，含 formin 与 fascin。","纤毛动力蛋白":"轴丝外臂与内臂上的动力蛋白，使相邻二联微管相对滑动，是纤毛摆动和左右轴建立（节点流）的动力来源。","γ微管蛋白":"存在于 MTOC 的微管蛋白变体，与 GCP 蛋白组成 γ-TuRC 环状模板，起始微管成核并决定 13 根原纤维数目。","原肌球蛋白":"细长双股卷曲螺旋，沿 F-肌动蛋白沟槽排列；静息时挡住肌球蛋白结合位点，受肌钙蛋白调控而移开。","肌钙蛋白":"由 TnT、TnI、TnC 三亚基组成的钙敏感开关，Ca²⁺ 结合 TnC 后牵动原肌球蛋白暴露结合位点，触发肌肉收缩。","MAP":"结合微管侧面稳定结构、调节动态并连接其他组分；Tau 病变与阿尔茨海默病相关。","胞质环流":"植物细胞靠肌球蛋白沿微丝带动细胞器与胞质定向流动，加速物质分配，在黑藻、轮藻叶细胞中极易观察。","动力蛋白臂":"轴丝 A 管上伸向相邻 B 管的内外两排动力蛋白突起，水解 ATP 产生滑动，是纤毛弯曲的直接动力装置。","成核反应":"聚合最慢的起始步骤：几个单体先形成稳定寡聚核心后才快速延伸；细胞内由 γ-TuRC 或 formin/Arp2/3 催化绕开这一限速。","G-肌动蛋白":"球状单体肌动蛋白，结合 ATP，加到纤维正端后 ATP 水解，使纤维两端具备不同的临界浓度与动态。","“步行”模型":"解释驱动蛋白行进：两个马达头部交替结合微管、像双脚轮流迈步，每水解 1 ATP 前进约 8 nm，可连续走数十步不脱落。","“尺蠖”爬行模型":"与步行模型相对的另一种马达运动假说：一个头始终在前，后头跟进再越过，形似尺蠖伸缩，用于解释部分单头或非常规马达。","核被膜":"包围细胞核的双层膜，外膜连内质网、内膜贴核纤层，两层在核孔处融合，把转录与翻译分隔在不同区室。","核孔复合体":"嵌在核孔上的八重对称超大蛋白复合体（约 30 种核孔蛋白），小分子自由扩散，大分子需带 NLS/NES 由转运受体主动运送。","染色质":"间期核内 DNA 与组蛋白、非组蛋白的复合物，以核小体为重复单位逐级折叠；按凝缩程度分常染色质与异染色质。","染色体":"分裂期染色质高度螺旋凝缩成的棒状结构，每条含两条姐妹染色单体，便于把复制后的基因组均分给子细胞。","组蛋白":"富含 Arg、Lys 的碱性小蛋白，H2A/H2B/H3/H4 组成核小体核心八聚体，H1 锁住进出口 DNA；尾部修饰构成「组蛋白密码」。","非组蛋白":"染色质中除组蛋白外的蛋白，包括骨架蛋白、复制转录机器与调控因子，多带负电、具组织特异性与动态性。","核小体":"Kornberg 1974 年提出：约 147 bp DNA 左手缠绕组蛋白八聚体 1.65 圈，相邻核小体由连接 DNA 串成「串珠」，是染色质一级结构。","常染色质":"间期疏松、染色浅、转录活跃的区域，DNaseⅠ 敏感、复制较早，富集活跃组蛋白修饰如 H3K4me3。","常染色体":"核型中除性染色体外的全部染色体，人类为 1—22 号，成对存在且雌雄相同。","异染色质":"间期仍高度凝缩、染色深、转录沉默的区域，复制晚、重复序列多，分结构性（着丝粒端粒）与兼性两类。","结构性异染色质":"在所有细胞、整个发育期都保持凝缩且不转录，集中于着丝粒、端粒与次缢痕，富含卫星 DNA，起结构支撑作用。","兼性异染色质":"在特定细胞或发育阶段才凝缩失活，可随信号重新开放；典型是雌性哺乳动物失活的一条 X 染色体（巴氏小体）。","着丝粒":"染色体上由 CEN 序列与特异染色质构成的主缢痕，组装动粒，是纺锤体牵引姐妹染色单体分离的部位。","端粒":"染色体末端由富 G 重复序列（人 TTAGGG）与 shelterin 蛋白组成的保护帽，解决末端复制难题并防止被误认作 DNA 断裂。","端粒酶":"Greider 与 Blackburn 1984 年发现的含 RNA 模板的逆转录酶，以自身 RNA 为模板补上端粒重复序列；生殖与干细胞活跃，多数体细胞关闭，2009 年获诺奖。","亲核蛋白":"在胞质合成、需经核孔主动运入细胞核并发挥作用的蛋白，如组蛋白、DNA 聚合酶与转录因子，携带 NLS。","NLS":"由连续（SV40 大 T 的 PKKKRKV）或双分型碱性氨基酸短序列构成，被 importin α/β 识别，Ran-GTP 梯度驱动入核。","核纤层":"内核膜下由核纤层蛋白组成的致密纤维网，支撑核形状、锚定核孔与染色质；有丝分裂时磷酸化解聚使核膜破裂。","核纤层蛋白":"属中间丝家族的 V 型蛋白（Lamin A/C、B），突变导致早老症等核膜病，是核力学与染色质组织的关键。","表观遗传学":"不改变 DNA 序列却可遗传的基因表达调控，机制含 DNA 甲基化、组蛋白修饰、染色质重塑与非编码 RNA。","NOR":"含串联重复 rRNA 基因的染色体次缢痕区域，分裂末期在其周围重新组建核仁，人类位于 13、14、15、21、22 号短臂。","核仁周期":"有丝分裂前期核仁随 rRNA 转录停止而解体，末期在 NOR 周围重新聚集融合成核仁的周期性变化。","多线染色体":"果蝇唾腺等细胞中 DNA 反复复制却不分离，形成上千条染色单体并排的巨大染色体，带横纹、膨泡 visible 转录活性。","灯刷染色体":"两栖类卵母细胞减Ⅰ双线期高度伸展的染色体，侧环上 RNA 大量转录，形似洗瓶刷，是研究转录活性的经典材料。","细胞核":"真核细胞最大细胞器，由核被膜、核孔、核纤层、染色质与核仁组成，储存基因组并统筹复制、转录与核糖体亚基装配。","纤维中心":"核仁内电镜浅染区，含未转录的 rDNA 与 RNA 聚合酶Ⅰ，是 rRNA 基因储存与转录起始的部位。","致密纤维组分":"包围纤维中心的高电子密度区，新生 rRNA 在此转录并接受早期加工与修饰。","颗粒组分":"核仁外层颗粒区，核糖体蛋白与加工好的 rRNA 在此装配成大小亚基前体，再经核孔输出。","次缢痕":"染色体上除主缢痕外的收窄部位，多含 NOR，与随体相连，可作为核型识别的标志。","随体":"由次缢痕隔开的染色体末端小球状片段， human 近端着丝粒染色体上常见，其大小具遗传多态性。","着丝粒DNA序列":"酵母 CEN 元件等保守序列，决定动粒组装位置；人类着丝粒由大段 α-卫星重复 DNA 与 CENP-A 染色质表观定义。","自主复制DNA序列":"酵母中能启动质粒自主复制的序列（ARS），含保守 ACS，是鉴定真核 DNA 复制起点的经典工具。","端粒DNA序列":"染色体末端的串联重复富 G 序列，人及其他脊椎动物为 TTAGGG，3′ 端留出单链突出形成 T 环保护。","核骨架":"核内由核纤层、核基质与残余核仁骨架构成的纤维网络，参与染色质环锚定、DNA 复制与转录的空间组织。","核仁":"核内无膜包裹的最大结构，负责 rRNA 转录加工与核糖体亚基装配，其大小常反映细胞蛋白合成活跃程度。","动粒":"着丝粒两侧由多层蛋白组成的盘状结构，连接纺锤体微管并产生拉力，还发出纺锤体组装检验点信号。","姐妹染色单体":"复制后由黏连蛋白环连在一起的两份相同染色单体，在后期经分离酶切割 cohesin 后分别移向两极。","DNaseI超敏感位点":"染色质上对 DNaseⅠ 特别敏感的短区段，提示核小体被排开、有转录因子结合，常用于定位启动子与增强子。","巴氏小体":"雌性哺乳动物间期核中凝缩失活的一条 X 染色体，由 Xist RNA 包被启动沉默，数目 = X 染色体数 −1，可作性别鉴定。","基因组":"一个物种或细胞所含全部遗传信息，人类核基因组约 3.2×10⁹ bp、约 2 万个编码基因，另加线粒体基因组。","组蛋白乙酰化":"HAT 把乙酰基加到组蛋白尾部赖氨酸，中和正电使染色质松开、促转录；HDAC 去乙酰化则压缩沉默，是表观调控核心开关。","染色质组装的四级结构模型":"核小体串珠（一级）→30 nm 螺线管（二级）→超螺线管/环状域（三级）→分裂期染色体（四级），逐级压缩约万倍。","位置花斑效应":"基因因染色体重排被挪到异染色质附近而出现随机、可克隆遗传的沉默，果蝇白眼基因斑驳表达是经典例证。","核型":"一个细胞中期全套染色体按大小、着丝粒位置与带型排列的图像，人类为 46,XX 或 46,XY，用于诊断数目与结构异常。","核型模式图":"把核型中各染色体按标准编号、比例绘制的示意条带图，便于标注断点、易位与缺失位置。","染色体带型":"经胰酶消化后 Giemsa 染色（G 显带）或荧光染料产生的明暗相间横纹，每条染色体带型唯一，可精确识别重排。","染色质重塑":"SWI/SNF、ISWI 等 ATP 依赖复合体滑动、驱逐或置换核小体，改变 DNA 可及性，从而开关转录、复制与修复。","核体":"核内无膜、动态聚集的功能小体统称，如 Cajal 体（snRNP 装配）、PML 体、speckle（剪接因子储存），靠液-液相分离形成。","转录因子":"结合启动子或增强子特定 DNA 基序、招募或阻断 RNA 聚合酶的调控蛋白，含 DNA 结合域与激活域，是组合调控的执行者。","核糖体":"Palade 1955 年发现：由 rRNA 与蛋白组成的大小两亚基颗粒，沿 mRNA 读密码子、由肽酰转移酶活性把氨基酸接成肽链，2009 年获诺奖。","多核糖体":"一条 mRNA 上同时串联多个核糖体依次翻译，像串珠一样在电镜下可见，能在短时间内大量合成同一蛋白。","核酶":"具催化活性的 RNA，如四膜虫 rRNA 内含子自剪接、RNase P 与核糖体肽酰转移酶中心；Cech 与 Altman 1982 年发现，1989 年获诺奖。","遗传密码":"mRNA 上 3 个核苷酸决定 1 个氨基酸，共 64 个密码子含 3 个终止；Nirenberg、Khorana、Holley 1960 年代破译，1968 年获诺奖，具简并性与通用性。","“RNA世界”假说":"Gilbert 1986 年提出：生命早期曾以 RNA 同时充当信息载体与催化剂，后来才分化出 DNA 存储与蛋白催化，核酶的发现是其重要支撑。","附着核糖体":"结合在内质网膜（经移位子）上的核糖体，合成分泌蛋白、膜蛋白与溶酶体蛋白，产物直接进入内膜系统。","游离核糖体":"分散在胞质基质中的核糖体，合成留在胞质、进入核、线粒体或过氧化物酶体的蛋白，与附着核糖体结构相同可互换。","SD序列":"原核 mRNA 起始密码子上游约 7 个核苷酸的富嘌呤序列（AGGAGG），与 16S rRNA 3′ 端互补，把核糖体定位到正确起始位点。","细胞通讯":"一个细胞发出的信号被另一细胞受体接收并引起反应的全过程，含旁分泌、内分泌、自分泌与接触依赖四种基本方式。","细胞信号通路":"从受体到效应器的一串有序分子事件，靠磷酸化级联逐级放大、分叉与整合，最终改变代谢、分泌或基因表达。","G蛋白偶联受体":"七次跨膜的最大受体家族，配体结合后催化 Gα 换上 GTP 并解离，调节腺苷酸环化酶或磷脂酶 C；相关研究获 1994、2012 年诺奖。","受体":"特异识别配体或信号并把它转成胞内事件的蛋白，具高亲和力、可饱和、可逆与组织特异性；按位置分膜受体与胞内受体。","细胞信号转导":"胞外信号经受体转换为胞内第二信使与蛋白磷酸化级联，逐级放大后引起特定细胞应答，并受脱敏与负反馈精确终止。","第二信使学说":"Sutherland 1957 年研究肾上腺素升血糖时提出：激素（第一信使）不进细胞，而是让膜上酶产生 cAMP 等胞内小分子代为传令，1971 年获诺奖。","第二信使":"激素等第一信使不进入细胞，而在胞内生成 cAMP、IP₃、DAG、Ca²⁺ 等小分子代为传令并级联放大，Sutherland 因提出该学说获 1971 年诺奖。","信号分子":"细胞间传递信息的化学载体，含激素、神经递质、生长因子、细胞因子与气体分子，按溶解性决定用膜受体还是胞内受体。","酶联受体":"单次跨膜、胞内段本身带酶活性或直接结合酶的受体，配体使其二聚并互相磷酸化，典型为 RTK 与 JAK-STAT 通路受体。","受体酪氨酸激酶":"配体（如 EGF、胰岛素）诱导二聚后胞内段交叉磷酸化酪氨酸，招来含 SH2/PTB 结构域的信号蛋白，启动 Ras-MAPK 与 PI3K-Akt 级联。","细胞间接触依赖性通讯":"信号分子与受体都锚在相邻细胞膜上，必须细胞直接接触才能传递，如 Notch-Delta 通路，在发育图式形成与侧抑制中关键。","信号级联":"一级激活下一级、每级都催化多个底物的链式反应，能把微弱胞外信号放大数万倍，同时提供多个调控节点。","内分泌信号":"内分泌细胞把激素释放入血，随循环运到远距离靶器官，浓度低、作用慢而持久，如胰岛素、甲状腺素。","旁分泌信号":"信号分子只扩散到邻近几个细胞即被降解或摄取，作用范围短、速度快，如生长因子、一氧化氮与突触间隙递质。","自分泌信号":"细胞分泌的信号作用于自身或同类细胞受体，常见于免疫细胞克隆扩增与肿瘤细胞自主生长环路。","气体信号分子":"NO、CO、H₂S 等可自由穿膜的小气体，半衰期极短、不需受体在膜上；NO 由 NO 合酶生成、激活鸟苷酸环化酶使血管舒张，1998 年获诺奖。","分子开关":"在活化/失活两态间可逆切换的调控蛋白，典型是结合 GTP 开启、水解 GTP 关闭的小 G 蛋白，以及磷酸化/去磷酸化开关。","GTP结合蛋白（G蛋白）":"结合 GTP 时活化、自带 GTP 酶把 GTP 水解成 GDP 后关闭；分异三聚体 G 蛋白与 Ras 类小 G 蛋白，是信号通路的计时器。","细胞识别":"细胞通过表面糖链、黏附分子与受体辨别「自己/异己」或同类细胞，是胚胎组织分选、免疫应答与受精特异性的基础。","双信使信号通路":"磷脂酶 Cβ 把 PIP₂ 切成 IP₃ 与 DAG 两个信使：IP₃ 促内质网放 Ca²⁺，DAG 留膜上协同激活 PKC，二者共同完成应答。","CaM":"含 4 个 EF 手结构域；结合 Ca²⁺ 后构象张开，包裹并激活 CaM 激酶、钙调磷酸酶等靶酶，是钙信号的主要解读器。","细胞内受体":"位于胞质或核内的受体，配体为可穿膜的脂溶性分子（甾体激素、甲状腺素、视黄酸），结合后直接作为转录因子调控基因表达。","表面受体":"嵌在质膜上的受体统称，接收水溶性信号后经构象变化或二聚把信息传过膜，分离子通道偶联、G 蛋白偶联与酶联三类。","蛋白激酶C":"由 DAG、Ca²⁺ 与磷脂共同激活的丝/苏氨酸激酶，磷酸化众多底物调控分泌、增殖与代谢；佛波酯可长期激活它促癌。","蛋白激酶A":"cAMP 结合调节亚基释放催化亚基而活化的四聚体酶，磷酸化 CREB 与糖原磷酸化酶激酶，是 cAMP 通路的主要效应器。","受体脱敏":"持续刺激下受体虽仍结合配体却不再传信号，多由 GRK 磷酸化后招募 arrestin 阻断 G 蛋白偶联，是防止过度刺激的保护机制。","受体隐蔽（受体没收）":"受体被内吞暂存在胞内体、膜上数量暂时减少，刺激撤除后可循环回膜，属短时程可逆的负调控。","受体下调":"长期高浓度配体使受体合成减少、降解增加，膜上总数真正下降，需重新合成才能恢复，是慢而持久的适应。","受体失活":"通过去磷酸化、结合抑制蛋白或构象锁定把已激活受体关掉，与脱敏、隐蔽、下调共同构成信号终止机制。","离子通道偶联受体":"受体本身就是配体门控离子通道，递质结合即开放，毫秒级改变膜电位，如烟碱型乙酰胆碱受体、GABA_A 受体。","信号蛋白失活":"由 GTP 酶激活蛋白促 GTP 水解、磷酸酶去磷酸化、或泛素化降解把通路组分关断，保证信号有始有终。","小G蛋白":"单体 GTP 结合蛋白超家族（Ras、Rho、Rab、Ran、Arf），分别管增殖、骨架、膜泡运输、核转运与包被组装；Ras 突变是常见癌变驱动。","局部介质":"由多种细胞释放、只在局部微环境短距离起效且迅速被清除的信号分子，如前列腺素、组胺与生长因子。","钙火花":"心肌等细胞肌质网上一小簇 RyR 通道同步开放产生的局部瞬时 Ca²⁺ 释放事件，是钙诱导钙释放的基本量子单位。","细胞周期":"一次分裂完成到下一次分裂结束的循环，分 G1、S、G2、M 四期；Hartwell、Hunt、Nurse 用酵母与海胆找出 CDK/周期蛋白，2001 年获诺奖。","有丝分裂":"真核体细胞分裂方式，分前、前中、中、后、末五期，姐妹染色单体均等分到两个遗传相同的子细胞，染色体数不变。","减数分裂":"生殖细胞特有的连续两次分裂、DNA 只复制一次：减Ⅰ同源染色体分离并发生交换，减Ⅱ姐妹染色单体分开，结果染色体数减半并产生重组多样性。","有丝分裂器":"分裂期由纺锤体、中心体、星体与染色体共同组成的临时装置，负责把染色体捕捉、整列并拉向两极。","纺锤体":"由微管与马达蛋白构成的双极梭形结构，含动粒微管、极微管与星体微管，是染色体分离的执行机器。","联会":"减Ⅰ前期同源染色体沿长度紧密配对的现象，从偶线期开始、粗线期完成，是交换与重组的前提。","联会复合体":"联会时同源染色体之间形成的梯状蛋白结构，由两条侧元件与中央元件经横向纤维连接，使配对精确对位。","细胞周期同步化":"用药物阻断或物理挑选把一群细胞调到同一时相，便于批量研究某时相的生化事件，分自然、选择与诱导同步化。","四分体":"减Ⅰ前期一对同源染色体各含两条姐妹染色单体、共四条并排的结构；非姐妹染色单体在此发生交叉与交换。","限制点":"哺乳动物 G1 期末的 R 点：越过它后细胞不再依赖生长因子即可自主完成本轮周期，由 Rb-E2F 与周期蛋白 D/CDK4 控制。","DNA合成阻断法":"加过量胸苷、羟基脲或阿糖胞苷抑制 DNA 合成，把细胞停在 G1/S 交界，撤药后即同步进入 S 期。","分裂中期阻断法":"用秋水仙素或诺考达唑破坏微管，使细胞停在中期（纺锤体检验点）， shake-off 收集可获得大量 M 期细胞。","分裂沟":"胞质分裂后期细胞赤道部质膜向内凹陷形成的环形沟，由皮层收缩环收紧，最终把细胞缢裂为二。","收缩环":"紧贴分裂沟皮层的肌动蛋白-肌球蛋白Ⅱ环形束，靠 RhoA 通路组装，收缩产生缢裂力，分裂完成后解聚。","染色体整列":"前中期染色体在动粒微管牵引与极向推力平衡下，逐步移动到赤道板排成一列，是纺锤体检验点放行前必须完成的步骤。","人工选择同步化":"不施加药物，靠有丝分裂细胞变圆易脱落（摇落法）或密度梯度离心按大小分选，物理收集同一时相细胞。","人工诱导同步化":"用药物、营养剥夺或温度突变把细胞阻断在特定时相，再撤除阻断使其齐步前进，是常用的同步手段。","自然同步化":"某些生物本身同步分裂，如黏菌变形体、海胆早期胚胎与部分藻类，无需处理即可获得同期材料。","基因重组":"DNA 片段断裂重接造成遗传信息重新组合，减Ⅰ交叉是最典型形式；同源重组还用于 DNA 双链断裂修复与基因打靶。","双线期":"减Ⅰ前期第四阶段，联会复合体解体、同源染色体开始分开但在交叉处仍相连，卵母细胞可在此期停滞数十年。","终变期":"减Ⅰ前期最后阶段，染色体进一步凝缩、交叉端化，核仁核膜消失、纺锤体形成，准备进入中期Ⅰ。","G2期":"S 期之后、M 期之前的间隙期，细胞继续生长、合成微管蛋白与成熟促进因子，并检查 DNA 复制是否完整。","终末分化细胞":"已获得专门形态功能且永久退出细胞周期、一般不再分裂的细胞，如神经元、心肌细胞与成熟红细胞。","G0期细胞":"暂时离开周期、停止增殖但仍保持代谢与功能的静息细胞，如静止淋巴细胞与肝细胞，受刺激可重返 G1。","赤道板":"中期染色体着丝粒整齐排列的假想平面，位于纺锤体两极中央，不是真实结构，标志染色体已完成整列。","细胞板":"植物细胞胞质分裂时，来自高尔基体的囊泡在赤道面融合成盘状结构并向外扩展，最终形成新细胞壁与中胶层。","胞质分裂":"核分裂之后把细胞质、细胞器与膜分给两个子细胞的过程；动物靠收缩环缢裂，植物靠细胞板由内向外建成新壁。","同源染色体":"一对分别来自父方与母方、形态大小与基因座顺序相同的染色体，减Ⅰ时配对、交换后彼此分离。","染色质凝缩":"分裂前期染色质在凝缩蛋白与拓扑异构酶Ⅱ作用下逐级螺旋折叠成短粗染色体，避免分离时缠绕断裂。","中心体循环":"中心粒在每个周期复制一次、分裂时两中心体分开建立纺锤体两极，再各带一对中心粒进入子细胞的周期性过程。","动粒微管":"一端接动粒、一端连纺锤体极的微管，后期靠缩短与马达把染色体拉向两极，是分离的直接受力纤维。","星体微管":"从中心体向细胞皮层放射的短微管，与皮层动力蛋白作用把纺锤体定位、拉开两极并决定分裂沟位置。","重组节":"联会复合体中央元件上出现的致密小结，含 Rad51、Mlh1 等重组蛋白，标记交叉即将发生的位置。","S期促进因子":"推动细胞从 G1 进入并启动 DNA 复制的调控活性，主要由 S 期周期蛋白-CDK 复合物与 Cdc6/Cdt1 等复制许可因子构成。","细胞有丝分裂促进因子":"MPF：Masui 与 Hartwell 等发现的 M 期促进活性，实为周期蛋白 B-CDK1；磷酸化核纤层、凝缩蛋白等促核膜解体与染色体凝缩。","癌基因":"能使正常细胞恶性转化的基因，多由原癌基因突变、扩增或病毒插入而持续激活，如 ras、myc，产物多为生长信号通路组分。","原癌基因":"正常细胞中存在的促生长、促分裂基因（生长因子、受体、信号蛋白、转录因子），本身必需，突变或过表达后才成为癌基因。","抑癌基因":"抑制增殖、修复 DNA 或促凋亡的「刹车」基因，如 p53、Rb、APC；需两份都失活才促癌，p53 是人类肿瘤中最常突变的基因。","检验点":"周期中的监控机制：DNA 损伤、复制未完成或纺锤体未正确连接时暂停进程，给修复留时间，失败则导向凋亡，是基因组稳定的保障。","周期蛋白":"Tim Hunt 1982 年在海胆卵发现、随周期合成与骤降的一类调节亚基，靠周期蛋白框结合并激活 CDK，决定激酶何时、作用于何底物。","周期蛋白依赖性蛋白激酶":"CDK：本身无活性、须结合周期蛋白并经磷酸化才活化的丝/苏氨酸激酶，是驱动周期时相转换的核心引擎。","G1期周期蛋白":"周期蛋白 D 等，在生长因子刺激下累积，与 CDK4/6 磷酸化 Rb 释放 E2F，帮助细胞通过限制点。","M期周期蛋白":"周期蛋白 B，与 CDK1 组成 MPF；后期由 APC 加上泛素链后在蛋白酶体降解，使细胞退出 M 期。","肿瘤细胞":"发生恶性转化、增殖失控但尚未具侵袭转移能力的细胞群体，可形成原位瘤，异型性与核分裂象增多。","癌细胞":"突破基底膜、获得侵袭与转移能力的恶性肿瘤细胞，具无限增殖、逃避免疫、诱导血管新生与代谢重编程等特征。","早熟染色体凝缩":"Rao 与 Johnson 1974 年用细胞融合发现：M 期细胞与间期细胞融合，会迫使间期核提前凝缩成单条或双条细长染色体，据此判明间期时相。","CKI":"p21、p27、p16 等结合周期蛋白-CDK 复合物阻断活性，介导 DNA 损伤或接触抑制引起的周期停滞，常属抑癌蛋白。","后期促进复合物":"APC/C：E3 泛素连接酶，被 Cdc20 激活后泛素化 securin 与周期蛋白 B，释放分离酶切开 cohesin，启动姐妹染色单体分离并退出 M 期。","肿瘤干细胞":"肿瘤中一小群具自我更新与多向分化能力、对放化疗耐受的细胞，被认为是复发与转移的根源。","视网膜母细胞瘤基因（Rb基因）":"人类第一个被克隆的抑癌基因（1986），Rb 蛋白结合 E2F 阻止 G1/S 转录；被周期蛋白 D-CDK4 磷酸化后释放 E2F，是限制点的分子核心。","DNA复制检验点":"S 期与 G2 监测复制叉停滞或 DNA 损伤，经 ATR/Chk1 抑制 CDK、稳定复制叉并阻止提前进入 M 期。","周期蛋白框":"周期蛋白中约 100 个氨基酸的保守结构域，负责与 CDK 结合并使之活化，是各周期蛋白共有的标志性序列。","破坏框":"周期蛋白 N 端 9 个氨基酸的保守序列（RxxLxxxxN），被 APC/C 识别后泛素化降解，保证周期单向不可逆推进。","细胞分裂周期基因":"Hartwell 用温度敏感酵母突变株筛出的 cdc 基因群，其产物（如 Cdc2/CDC28）控制周期各步，是 CDK 概念的实验起点。","细胞分化":"同一基因组的细胞经选择性表达产生形态、结构与功能差异的过程，通常稳定且不可逆，由转录因子组合与表观修饰锁定。","管家基因":"所有细胞为维持基本代谢都持续表达的基因，如糖酵解酶、肌动蛋白、核糖体蛋白，表达量受环境影响小。","奢侈基因":"只在特定分化细胞中表达、赋予其专门功能的基因，如血红蛋白、免疫球蛋白、胰岛素，是分化状态的标志。","组织特异性基因":"与奢侈基因近义，指只在某一组织或细胞类型开启的基因，靠组织特异启动子与增强子组合实现。","细胞的全能性":"单个细胞发育成完整个体的能力；Haberlandt 1902 年提出设想，Steward 1958 年用胡萝卜体细胞再生植株证实，Gurdon 核移植与山中因子进一步证明核基因组完整。","细胞决定":"分化方向在形态变化之前就已被内在或外在信号不可逆地限定，此时外观尚正常，但移植到别处仍按既定命运发育。","细胞记忆":"细胞把某次调控状态（转录因子环路、DNA 甲基化、组蛋白修饰）通过分裂稳定传给子代，使分化状态长期维持而不必持续依赖诱导信号。","干细胞":"具自我更新与多向分化潜能的未分化细胞，按来源分胚胎与成体，按潜能分全能、多潜能、多能与单能。","全能干细胞":"能发育成完整个体（含胚外组织）的细胞，仅受精卵与早期卵裂球具备，是潜能谱系的最顶端。","诱导性多潜能干细胞":"山中伸弥 2006 年用 Oct4、Sox2、Klf4、c-Myc 四因子把小鼠成纤维细胞重编程为类 ES 细胞，2012 年获诺奖，绕开胚体伦理争议。","化学诱导的多潜能干细胞":"邓宏魁团队 2013 年仅用小分子化合物组合把小鼠体细胞重编程为 CiPSC，不导入外源基因，安全性更高。","多潜能干细胞":"能分化为三胚层各种细胞但不能形成完整个体与胚外组织，如胚胎干细胞与 iPS 细胞。","多能干细胞":"只能分化为某一组织谱系内的多种细胞，如造血干细胞可分出各类血细胞，潜能比多潜能窄。","单能干细胞":"只能产生一种细胞类型但仍能自我更新，如表皮基底层干细胞、精原干细胞，负责组织的日常更替。","细胞的多能性":"一个干细胞能分化为同一胚层或组织内多种细胞类型的能力，是成体干细胞维持组织稳态的基础。","单能性":"分化潜能限于单一细胞类型的状态，是潜能层级中最受限的一级，不代表细胞没有增殖能力。","转分化":"一种已分化细胞不经过去分化而直接转成另一种分化细胞，如胰腺外分泌细胞转为 β 细胞，可由导入关键转录因子实现。","去分化":"已分化细胞退回较原始、增殖活跃状态并丢失专门功能，常见于蝾螈肢体再生时的芽基形成与植物愈伤组织。","胚胎干细胞":"Evans、Kaufman 与 Martin 1981 年从小鼠囊胚内细胞团建系，可无限增殖并保持多潜能性，是基因打靶与发育研究的基石，2007 年获诺奖。","成体干细胞":"存在于已分化组织中的未分化细胞，负责生理更新与损伤修复，如骨髓造血、肠隐窝与神经发生区的干细胞。","决定子":"卵内不均分布的母源 mRNA 或蛋白，卵裂时被分到特定 blastomere，从而预先决定该细胞及其后代的发育命运。","隐蔽mRNA":"卵母细胞中与蛋白结合、被「掩蔽」而不翻译的母源 mRNA，受精或成熟后解除抑制才启动早期发育所需的蛋白合成。","胚胎诱导":"Spemann 与 Mangold 1924 年发现：一部分胚胎组织（组织者）发出信号，决定邻近细胞的分化方向，如脊索诱导外胚层形成神经板，1935 年获诺奖。","再生现象":"生物体丢失组织或器官后重新长出并恢复形态功能，蝾螈肢体靠去分化形成再生芽基，哺乳动物以肝代偿性增生与组织干细胞修复为主。","细胞谱系":"从受精卵到某个终末分化细胞的全部分裂与命运记录，可用染料标记、遗传示踪或单细胞测序回溯，是发育生物学的基本图谱。","位置效应":"基因或细胞因所处位置（染色质环境、形态发生素浓度、细胞邻接关系）不同而表现出不同表达或命运，是图式形成的核心原则。","类器官":"由干细胞或组织细胞在三维培养中自组织形成的微型器官样结构，具部分原位组织的结构与功能，用于发育研究、药筛与疾病建模。","组合调控":"少数转录因子以不同组合搭配，即可指定多种细胞类型；靠组合而非「一基因一命运」大幅扩展调控容量，是真核分化的一般逻辑。","多潜能性":"细胞能产生三个胚层几乎所有细胞类型的能力，由 Oct4/Sox2/Nanog 核心网络与开放染色质状态维持。","再生医学":"用干细胞、类器官、组织工程与基因修复来替换或再生受损组织器官的医学方向，目标是让不可逆损伤重新获得功能。","细胞连接":"相邻细胞或细胞与基质间特化的连接装置，按功能分封闭连接、锚定连接与通信连接三大类，是多细胞组织协同的结构基础。","封闭连接":"把相邻细胞膜间隙完全封住、阻止物质沿细胞间隙自由穿过的连接，脊椎动物中即紧密连接，维持上皮极性与屏障功能。","通信连接":"允许离子与小分子直接在相邻细胞胞质间通过的连接，动物为间隙连接、植物为胞间连丝，实现代谢偶联与电信号同步。","锚定连接":"把相邻细胞或细胞与基质的骨架连成力学整体的连接，胞内接微丝（黏着带、黏着斑）或中间丝（桥粒、半桥粒）。","紧密连接":"相邻质膜最顶端的带状封闭结构，由 claudin、occludin 与 ZO 蛋白组成，像拉链封住细胞间隙、阻止膜蛋白侧向扩散以维持上皮极性。","间隙连接":"由两个半通道（连接子）对接成的亲水孔道，允许 <1 kDa 的离子、cAMP 等通过，使心肌与平滑肌电活动同步。","胞间连丝":"穿过植物细胞壁、内连内质网衍生连丝微管的细胞质通道，让相邻细胞形成共质体，可运输糖、RNA 甚至病毒运动蛋白。","化学突触":"神经元之间靠突触前释放递质、突触间隙扩散、突触后受体接收来单向传递信号的结构，有约 0.5 ms 突触延搁，是可塑性的主要位点。","桥粒":"点状铆钉样连接：钙黏蛋白（desmoglein）在胞外拉住邻细胞，胞内经斑蛋白连到中间丝，给表皮、心肌提供抗剪切强度。","半桥粒":"形似半个桥粒，由整联蛋白 α6β4 把细胞基底面铆到基膜的层粘连蛋白上，胞内连中间丝，使上皮牢固贴附基底。","黏着带":"位于紧密连接下方的连续环带，钙黏蛋白经连环蛋白连到微丝束，收缩时可改变上皮细胞形状、参与神经管形成。","黏着斑":"整联蛋白聚成的点状黏附位点，外连纤连蛋白/胶原、内经踝蛋白与黏着斑激酶连微丝，兼具力学锚定与双向信号传感。","细胞黏着分子":"介导细胞-细胞或细胞-基质黏附的膜糖蛋白统称，主要分钙黏蛋白、选择素、整联蛋白与免疫球蛋白超家族四类。","细胞外基质":"由细胞分泌到胞外的蛋白与多糖网络，含胶原、弹性蛋白、蛋白聚糖与黏连糖蛋白，既提供力学支撑又调控迁移、增殖与分化。","钙黏蛋白":"依赖 Ca²⁺ 的同亲型黏附分子，胞外域同类相互拉手、胞内经 β-连环蛋白连骨架；E-cadherin 丢失是上皮间质转化与癌转移标志。","选择素":"识别特定糖链（如 sLeˣ）的 Ca²⁺ 依赖黏附分子，分 L、E、P 三类，介导白细胞在血管内皮上滚动，是炎症起始的第一步。","IgSF":"含免疫球蛋白样结构域的一大类黏附分子，多不依赖 Ca²⁺，如 ICAM、VCAM、NCAM，参与免疫细胞黏附与神经发育。","整联蛋白":"α/β 异二聚体跨膜受体，外连 ECM 的 RGD 序列、内连骨架与信号分子，可「由内向外」调亲和力，实现双向跨膜信号。","层粘连蛋白":"基膜主要成分，由 α、β、γ 三条链组成的十字形大糖蛋白，提供细胞附着位点并指导上皮极性与神经突起生长。","纤连蛋白":"由二聚体组成的多功能黏连糖蛋白，含 RGD 与肝素、胶原结合域，把整联蛋白与胶原/蛋白聚糖桥接起来，参与伤口愈合与细胞迁移。","胶原":"三条左手肽链缠成右手三股螺旋，每三位必为 Gly，富含 Pro 与羟脯氨酸（需维 C 羟化）；缺陷致坏血病与成骨不全。","弹性蛋白":"富含疏水与赖氨酸交联（锁链素）的 ECM 蛋白，交联网可反复拉伸回弹，赋予肺、大血管与皮肤弹性，随年龄下降而松弛。","基膜":"上皮或内皮细胞下方厚约 50—100 nm 的薄层片状 ECM，由层粘连蛋白、Ⅳ型胶原、巢蛋白与蛋白聚糖构成，起支撑、过滤与极性诱导作用。","细胞外被":"质膜外表面由糖蛋白糖脂的寡糖链与吸附的蛋白聚糖形成的富糖绒毛层，厚约 10—20 nm，带负电，参与保护、润滑与细胞识别。","连接子":"间隙连接的半通道，由 6 个 connexin 亚基围成；两个相邻细胞的连接子对接才形成完整孔道，pH 与 Ca²⁺ 可调控其开闭。","糖胺聚糖":"由重复二糖（糖醛酸+氨基糖）构成的长而不分支的多糖，因羧基与硫酸根带强负电、吸水成凝胶，如透明质酸、硫酸软骨素。","蛋白聚糖":"核心蛋白共价接一条或多条糖胺聚糖链形成的「瓶刷状」大分子，大量存在于 ECM，靠吸水抗压并富集、呈递生长因子。","同亲型结合":"相邻细胞上同种黏附分子彼此识别结合，如两条钙黏蛋白相互拉手，是同类细胞分选聚集的分子基础。","异亲型结合":"两种不同黏附分子相互识别结合，如选择素与糖链、整联蛋白与 ICAM，常见于白细胞与内皮的异型细胞黏附。","细胞黏着":"细胞通过黏附分子与邻细胞或胞外基质建立连接的过程，是组织形态维持、细胞迁移与信号传入的前提。","成纤维细胞":"结缔组织中最常见的梭形细胞，合成并分泌胶原、纤连蛋白等 ECM 成分，在伤口愈合中增殖并分化为肌成纤维细胞收缩创面。","氨基酸":"含 α-氨基、α-羧基、氢与侧链 R 基连在同一 α-碳上的小分子，除甘氨酸外均有手性；蛋白质由 20 种标准 L-氨基酸组成。","肽键":"一个氨基酸的 α-羧基与另一个的 α-氨基脱水缩合成的 —CO—NH— 键，具约 40% 双键性质故六个原子共平面、不能自由旋转。","一级结构":"多肽链中氨基酸的线性排列顺序，由 Sanger 1951 年测定牛胰岛素首次阐明，靠肽键与二硫键维持，决定高级结构与功能。","残基":"氨基酸缩合成肽后失去一分子水所剩下的部分，肽链中每个单元称残基；N 端与 C 端残基分别带游离氨基与羧基。","兼性离子":"同一分子内同时带正、负电荷而净电荷为零的形式；氨基酸在中性水中即成 ⁺H₃N—CHR—COO⁻，故熔点高、易溶于水。","等电点":"使氨基酸或蛋白净电荷为零的溶液 pH，记作 pI；此时溶解度最低、电泳不迁移，酸性氨基酸 pI 小、碱性氨基酸 pI 大。","二硫键":"两个半胱氨酸侧链 —SH 氧化成的 —S—S— 共价交联，稳定蛋白三级或四级结构；胰岛素 A、B 链即靠二硫键相连。","多肽":"多个氨基酸经肽键连成的链，通常指 10 个以上残基、分子量小于 10000 的肽；有方向性，从 N 端写到 C 端。","二肽":"两个氨基酸由一个肽键连接而成的最小肽，如肌肽、阿斯巴甜前体；命名时从 N 端残基起依次称某氨酰某氨酸。","二级结构":"多肽主链局部靠氢键形成的有规则构象，主要是 Pauling 与 Corey 1951 年提出的 α-螺旋与 β-折叠，另含 β-转角与无规卷曲。","α-螺旋":"每圈 3.6 个残基、螺距 0.54 nm 的右手螺旋，由第 i 位 C=O 与第 i+4 位 N—H 形成链内氢键，侧链朝外，Pro 常打断它。","β-折叠":"伸展的肽段并排，链间 C=O 与 N—H 成氢键连成片层，侧链交替朝上下；可平行或反平行，丝心蛋白是典型代表。","无规卷曲":"没有周期性规律、但并非完全随机的柔性肽段，常出现在转角与结构域连接处，承担活性位点与识别功能。","三级结构":"整条多肽链在二级结构基础上进一步折叠成的三维构象，靠疏水作用、氢键、盐桥、二硫键与范德华力维持，由 Anfinsen 核糖核酸酶实验证明由序列决定。","四级结构":"两条以上已折叠亚基按一定方式缔合成的功能寡聚体，如血红蛋白 α₂β₂；亚基间靠非共价作用，可产生协同与别构效应。","结构域":"多肽链中能独立折叠、常具独立功能的致密球状单元，由 50—300 残基组成，是蛋白模块化进化与结构分类的基本单位。","模体":"由几个二级结构元件按特定拓扑组合、具特征序列或功能的超二级结构，如锌指、亮氨酸拉链、螺旋-转角-螺旋，常为 DNA 结合基序。","变性":"加热、强酸碱、有机溶剂等破坏高级结构使活性丧失，但一级结构与肽键不变；表现为黏度升高、溶解度下降、易被蛋白酶水解。","复性":"变性因素去除后部分蛋白可自发恢复天然构象与活性；Anfinsen 用核糖核酸酶证明序列即含全部折叠信息，1972 年获诺奖。","氢键":"电负性大的原子（O、N）与共价连在其上的 H 之间的弱定向作用，键能约 12—30 kJ/mol，是二级结构与 DNA 双链配对的主要作用力。","疏水相互作用":"非极性侧链在水中避开水相而聚埋于蛋白内部的热力学驱动力，本质是水的熵增，是球蛋白折叠与膜形成的主要推手。","盐桥":"带相反电荷侧链（如 Lys⁺ 与 Asp⁻）之间的静电吸引加氢键，稳定蛋白构象，受 pH 与离子强度影响明显。","肌红蛋白":"Kendrew 1958 年用 X 射线解析出第一个蛋白三维结构：153 残基、8 段 α-螺旋，含一个血红素，在肌肉中储氧，氧结合曲线为双曲线。","血红蛋白":"成人 HbA 为 α₂β₂ 四聚体、各带一个血红素；结合氧具正协同与别构效应，呈 S 形曲线，并受 pH、CO₂ 与 2,3-BPG 调节（Bohr 效应）。","抗体":"B 细胞分化成浆细胞后分泌的免疫球蛋白，由两条重链两条轻链组成 Y 形，Fab 端特异结合抗原、Fc 端介导效应功能。","别构效应":"效应物结合蛋白活性中心以外的部位引起构象变化，从而改变活性或亲和力；Monod、Wyman、Changeux 1965 年提出 MWC 模型解释之。","协同效应":"一个亚基结合配体后改变其余亚基的亲和力，使结合曲线呈 S 形；血红蛋白结合氧是正协同的经典范例。","镰刀型红细胞贫血":"Pauling 1949 年称之为「分子病」：β 链第 6 位 Glu 被 Val 取代，脱氧 HbS 聚成纤维把红细胞拉成镰刀状，导致溶血与血管阻塞。","酶":"Sumner 1926 年脲酶结晶证明酶是蛋白：通过降低活化能加速反应、不改变平衡与 ΔG，具高效、专一、可饱和与可调控的特点。","底物":"酶所作用并被转化为产物的反应物，通过弱作用结合在活性中心形成 ES 复合物；其浓度决定反应是否接近 Vmax。","活性中心":"酶分子上由少数空间邻近残基构成的裂隙或口袋，含结合部位与催化部位，决定专一性；常用化学修饰与 X 射线晶体学定位。","辅因子":"酶发挥活性所需的非蛋白成分，含金属离子（Zn²⁺、Mg²⁺、Fe²⁺）与有机小分子（辅酶、辅基），缺之则脱辅酶无活性。","辅酶":"与酶松散结合、在反应中转运基团或电子的有机小分子，多由 B 族维生素衍生，如 NAD⁺、FAD、辅酶 A，反应后可扩散离开。","脱辅酶":"全酶去掉辅因子后剩下的纯蛋白部分，本身无催化活性，只有重新结合辅因子才恢复功能。","全酶":"脱辅酶与所需辅因子结合成的、具完整催化活性的形式；对需辅因子的酶而言「全酶 = 酶蛋白 + 辅因子」。","酶原":"某些酶先以无活性前体合成并分泌，到特定部位经有限水解切除抑制肽才活化，如胰蛋白酶原、胃蛋白酶原与凝血酶原，可避免自身消化。","诱导契合":"Koshland 1958 年修正锁钥学说：底物结合会诱导活性中心构象改变，使催化残基精确就位，也解释了酶对过渡态的高亲和力。","专一性":"酶只作用于特定底物或特定键的性质，分绝对、相对与立体异构专一性，源于活性中心的空间与化学互补。","竞争性抑制":"抑制剂与底物结构相似、争夺活性中心，可被提高底物浓度克服；动力学表观 Km 增大、Vmax 不变，如丙二酸抑制琥珀酸脱氢酶。","非竞争性抑制":"抑制剂结合活性中心以外部位，不影响底物结合但使酶失活，加底物不能解除；Vmax 降低、Km 基本不变。","别构酶":"活性受效应物在别构部位结合调节的多亚基酶，常位于代谢通路首步，动力学不服从米氏方程而呈 S 形，是反馈抑制的靶点。","米氏常数":"Michaelis 与 Menten 1913 年提出：反应速度达 Vmax 一半时的底物浓度 Km，越小表示酶与底物亲和力越高，是酶的特征常数。","最大反应速率":"底物完全饱和时酶促反应的极限速度 Vmax = kcat·[E]t，与酶浓度成正比，用于比较催化效率与计算转换数。","激活剂":"能使酶活性升高或使无活性酶原转变为活性酶的物质，如 Cl⁻ 激活唾液淀粉酶、Mg²⁺ 激活多种激酶。","抑制剂":"使酶活性下降的物质，按结合是否可逆分可逆（竞争、非竞争、反竞争）与不可逆（如有机磷抑制胆碱酯酶、青霉素抑制转肽酶）。","维生素":"维持正常代谢所必需、人体不能合成或合成不足的一小类有机物，分脂溶（A、D、E、K）与水溶（B 族、C）两类，多数作辅酶前体。","辅酶 A":"由泛酸（维生素 B₅）衍生、含巯基乙胺的辅酶，以 —SH 携带并转运酰基成乙酰 CoA 等硫酯，是糖、脂、氨基酸代谢的共同枢纽。","烟酰胺腺嘌呤二核苷酸（辅酶）":"由烟酸（B₃）衍生的 NAD⁺，作为脱氢酶的电子受体接受一个氢负离子变 NADH，把糖与脂氧化产生的还原力送进呼吸链。","还原型 NAD":"NADH：NAD⁺ 接受 2 电子 1 质子后的还原态，在 340 nm 有特征吸收；线粒体中经复合体Ⅰ氧化，约可驱动合成 2.5 个 ATP。","黄素腺嘌呤二核苷酸":"由核黄素（B₂）衍生的 FAD，作为琥珀酸脱氢酶等黄素蛋白的紧密结合辅基，可接受 2 个氢原子成 FADH₂。","还原型 FAD":"FADH₂：FAD 的还原态，在呼吸链复合体Ⅱ（琥珀酸脱氢酶）处把电子交给辅酶 Q，因绕过复合体Ⅰ，产 ATP 约 1.5 个。","核苷酸":"由含氮碱基、戊糖与磷酸组成的核酸基本单位，经 3′,5′-磷酸二酯键连成链；ATP、cAMP、NAD⁺ 等还兼作能量与信号分子。","碱基":"核苷酸中的含氮杂环，分嘌呤（A、G）与嘧啶（C、T、U）；具共轭双键故在 260 nm 有紫外吸收，靠互变异构决定配对方式。","嘌呤":"腺嘌呤与鸟嘌呤所属的双环（嘧啶并咪唑）碱基，由甘氨酸、谷氨酰胺、天冬氨酸与一碳单位逐步合成，代谢终产物为尿酸。","嘧啶":"胞嘧啶、胸腺嘧啶与尿嘧啶所属的单环六元杂环碱基，由氨甲酰磷酸与天冬氨酸合成，分解产物易溶于水。","脱氧核糖核酸":"Watson 与 Crick 1953 年据 Franklin 与 Wilkins 的 X 射线衍射提出双螺旋：两条反平行链靠 A-T、G-C 配对，携带并复制遗传信息，1962 年获诺奖。","核糖核酸":"以核糖为糖、含尿嘧啶代替胸腺嘧啶的单链核酸，分 mRNA、tRNA、rRNA 及众多调控 RNA，既传信息又有结构与催化功能。","双螺旋":"两条反平行多核苷酸链绕同一轴右手盘旋，碱基对在内侧堆叠、糖磷酸骨架在外，直径 2 nm、每圈 10.5 bp，有大沟小沟供蛋白识别。","复制":"Meselson 与 Stahl 1958 年用¹⁵N 密度梯度离心证实半保留复制：每条旧链作模板，DNA 聚合酶按 5′→3′ 合成新链，前导链连续、滞后链成冈崎片段。","转录":"RNA 聚合酶以 DNA 模板链为模板、不需引物地合成 5′→3′ RNA，经起始、延伸、终止三阶段；真核还需加帽、剪接与加 poly(A) 尾。","翻译":"核糖体沿 mRNA 5′→3′ 读三联体密码，tRNA 按反密码子搬运氨基酸，从 AUG 起始到终止密码子结束，经进位、成肽、移位循环延伸肽链。","密码子":"mRNA 上连续 3 个核苷酸组成的编码单元，64 个中 61 个编码氨基酸、3 个（UAA/UAG/UGA）为终止；具简并性、通用性与不重叠性，Crick 等用移码实验证实。","反密码子":"tRNA 反密码子环上的 3 个核苷酸，与 mRNA 密码子反向互补配对；摆动假说解释为何 61 个密码子只需约 40 种 tRNA。","信使 RNA":"由 DNA 转录而来、携带蛋白氨基酸序列信息的 RNA；原核半衰期短且可多顺反子，真核经 5′ 帽与 3′ poly(A) 尾保护并单顺反子。","转运 RNA":"约 70—90 核苷酸、三叶草二级结构倒 L 形三级结构的小 RNA，3′ 端 CCA 接氨基酸，由氨酰-tRNA 合成酶精确「充电」。","核糖体 RNA":"核糖体的结构与催化核心，原核为 16S/23S/5S、真核为 18S/28S/5.8S/5S；23S/28S rRNA 具肽酰转移酶活性，故核糖体本质上是核酶。","突变":"DNA 序列发生可遗传的改变，分碱基置换（转换/颠换）、插入缺失与染色体畸变；可由复制错误、诱变剂或转座引起，是进化原料也是遗传病根源。","单糖":"不能水解成更小糖的多羟基醛或酮，按碳数分丙糖至庚糖，如葡萄糖（己醛糖）、果糖（己酮糖）；有旋光性与变旋现象。","二糖":"两个单糖经糖苷键缩合而成，如麦芽糖（α-1,4 葡萄糖二聚）、蔗糖（葡萄糖+果糖）、乳糖（半乳糖+葡萄糖）；蔗糖无还原性。","多糖":"由十个以上单糖聚合而成的高分子，分同多糖（淀粉、糖原、纤维素）与杂多糖（透明质酸等），可储能或作结构材料。","葡萄糖":"最常见的六碳醛糖，分子式 C₆H₁₂O₆，在水溶液中以吡喃环为主并具变旋现象；是血糖主成分与糖酵解起点，也是脑的主要能源。","糖原":"动物储能多糖，主链 α-1,4、每 8—12 残基一个 α-1,6 分支，高度支化便于快速动员；主要储于肝（稳血糖）与肌肉（供收缩）。","淀粉":"植物储能多糖，由直链淀粉（α-1,4）与支链淀粉（α-1,4 加少量 α-1,6 分支）组成，遇碘显蓝紫色，是人类主食的主要碳水。","纤维素":"植物细胞壁结构多糖，葡萄糖以 β-1,4 键连成不分支直链，多条链靠氢键成微纤维；人体缺纤维素酶不能消化，但作膳食纤维。","糖苷键":"单糖半缩醛羟基与另一分子（醇、糖、碱基）脱水形成的缩醛键，需注明异头构型与碳位，如 α-1,4、β-1,4、N-糖苷键。","脂质":"不溶于水而溶于有机溶剂的一大类生物分子，含脂肪、磷脂、类固醇与蜡；承担储能、成膜、信号与保温等功能。","脂肪酸":"一端羧基、一端烃链的两亲羧酸，按饱和度分饱和与不饱和，按链长分短中长链；人体不能合成亚油酸、亚麻酸，故称必需脂肪酸。","甘油三酯":"甘油三个羟基各酯化一分子脂肪酸形成的储能脂，氧化放能约为等质量糖的两倍多，储于脂肪组织并由激素敏感脂肪酶动员。","类固醇":"以环戊烷多氢菲四环为母核的脂类，含胆固醇、甾体激素、胆汁酸与维生素 D；由异戊二烯经鲨烯环化合成。","微团":"去垢剂或脂肪酸盐超过临界浓度后自聚成的球状聚集体，疏水尾朝内、极性头朝外，可把脂溶性物质包在芯里助吸收。","双分子层":"磷脂在水中自发排成两片单分子层、疏水尾相对、亲水头朝两侧水相的片层结构，厚约 5 nm，是所有生物膜的基本构架。","糖酵解":"Embden、Meyerhof 与 Parnas 阐明（EMP 途径）：胞质中 1 分子葡萄糖经 10 步拆成 2 丙酮酸，净得 2 ATP 与 2 NADH，不需氧，是几乎所有细胞共有的最古老产能途径。","糖异生":"主要在肝与肾由丙酮酸、乳酸、甘油及生糖氨基酸合成葡萄糖，需绕过己糖激酶、磷酸果糖激酶与丙酮酸激酶三个不可逆步骤，共耗 6 个高能磷酸键。","糖原分解":"糖原磷酸化酶以磷酸解方式逐个切下 α-1,4 键上的葡萄糖-1-磷酸，脱支酶处理分支点，产物变 G-6-P 后入糖酵解或由肝释放入血。","磷酸戊糖途径":"Warburg 与 Dickens 等阐明：G-6-P 经氧化阶段产 2 NADPH 与 5-磷酸核糖，非氧化阶段可重排回糖酵解中间物；供还原合成与核苷酸原料，缺 G6PD 致蚕豆病。","丙酮酸":"糖酵解终产物，三条去路：有氧时经丙酮酸脱氢酶复合体变乙酰 CoA 入 TCA，无氧时还原成乳酸或经乙醇发酵，也可羧化成草酰乙酸补缺。","乳酸":"无氧或剧烈运动时由乳酸脱氢酶把丙酮酸还原生成，同时再生 NAD⁺ 以维持糖酵解；经血入肝走 Cori 循环重新变葡萄糖。","发酵":"无外源电子受体时，细胞以有机物自身作受体再生 NAD⁺ 的厌氧产能方式，如乳酸发酵与酵母乙醇发酵；巴斯德最早证明它由活细胞引起。","三羧酸循环":"Krebs 1937 年提出（1953 年获诺奖）：线粒体基质中乙酰 CoA 与草酰乙酸缩合，经 8 步彻底氧化，每轮产 3 NADH、1 FADH₂、1 GTP 与 2 CO₂，是糖脂蛋白代谢共同枢纽。","柠檬酸循环":"即三羧酸循环，因第一步产物为柠檬酸而得名，又称 Krebs 循环；不仅是分解通路，其中间物还为氨基酸、血红素合成提供碳骨架（两用代谢）。","乙酰辅酶 A":"由丙酮酸氧化脱羧、脂肪酸 β-氧化或氨基酸分解生成，含高能硫酯键，把乙酰基送入 TCA；也是合成脂肪酸、胆固醇与乙酰化修饰的通用乙酰基供体。","ATP 合酶":"嵌于内膜的 F₀F₁-ATP 酶，质子经 F₀ c 环带动 γ 轴旋转，使 F₁ 三个 β 亚基在开放、疏松、紧密三态间循环合成 ATP；Boyer 与 Walker 获 1997 年诺奖。","化学渗透":"Mitchell 1961 年提出（1978 年获诺奖）：电子传递把 H⁺ 泵到膜一侧，跨膜电化学势驱动 ATP 合成，统一解释了线粒体、叶绿体与细菌的产能机制。","质子动力势":"跨膜的质子浓度差（ΔpH）与电位差（Δψ）之和，Δp = Δψ − 2.3RT·ΔpH/F，是驱动 ATP 合酶、次级主动运输与细菌鞭毛转动的直接能量形式。","β-氧化":"Knoop 1904 年用苯标记脂肪酸提出：脂酰 CoA 在基质中每轮经脱氢、水化、再脱氢、硫解切下 1 分子乙酰 CoA 并产 FADH₂、NADH，直至全部分解。","酮体":"肝中乙酰 CoA 过量（饥饿、糖尿病）时生成的乙酰乙酸、β-羟丁酸与丙酮，可溶于水过血脑屏障供脑与肌肉作燃料；生成过多致酮症酸中毒。","脂肪生成":"在胞质由乙酰 CoA 羧化酶生成丙二酰 CoA，再经脂肪酸合酶循环加二碳单位合成软脂酸，最后与甘油-3-磷酸酯化成甘油三酯储存。","转氨基作用":"转氨酶以磷酸吡哆醛（维生素 B₆）为辅酶，把氨基酸的 α-氨基转给 α-酮戊二酸生成谷氨酸与相应酮酸，是氨基酸分解与合成的第一步，不释放游离氨。","尿素循环":"Krebs 与 Henseleit 1932 年阐明：肝中把有毒的氨与 CO₂ 经鸟氨酸、瓜氨酸、精氨酸四步转成尿素排出，耗 3 ATP，是陆生哺乳动物排氮主途径。","脱氨基作用":"氨基酸脱去氨基生成相应 α-酮酸与氨，主要方式是谷氨酸经谷氨酸脱氢酶氧化脱氨，联合脱氨基（转氨+氧化脱氨）效率最高。","叶绿素":"含卟啉环螯合 Mg²⁺ 与植醇尾的绿色色素，主要吸收红光与蓝紫光、反射绿光；叶绿素 a 是反应中心色素，b 为天线色素。","激素":"由内分泌腺或细胞分泌、经体液运到靶组织、微量即显著调节代谢与发育的化学信使，按化学性质分肽类、甾体与氨基酸衍生物三类。","胰岛素":"Banting 与 Best 1921 年发现、1923 年获诺奖：胰岛 β 细胞分泌的 51 残基双链肽，经 RTK-PI3K-Akt 促 GLUT4 转位、降血糖并促合成代谢；Sanger 因测其序列获 1958 年诺奖。","胰高血糖素":"胰岛 α 细胞分泌的 29 残基肽，与 GPCR 结合后经 cAMP-PKA 促肝糖原分解与糖异生升血糖，与胰岛素拮抗共同维持血糖稳态。","环磷酸腺苷":"Sutherland 与 Rall 发现的第一个第二信使：由腺苷酸环化酶把 ATP 环化生成，激活 PKA 磷酸化 CREB 与代谢酶，被磷酸二酯酶水解成 5′-AMP 而终止信号。","G 蛋白":"Rodbell 与 Gilman 发现（1994 年诺奖）：由 α、β、γ 三亚基组成，α 结合 GTP 后解离并调节效应酶；分 Gs（激活 AC）、Gi（抑制 AC）、Gq（激活 PLC）等。","信号转导":"细胞把胞外信号经受体、G 蛋白/激酶级联与第二信使层层传递放大，最终改变酶活性或基因表达，并由磷酸酶、GTP 酶与受体内吞精确终止。"};
function briefNote(t){
  const m=String(t.m||""), e=String(t.e||""), en=e.replace(/\s+/g,"");
  const keys=[m,
              m.replace(/[（(][^）)]*[）)]/g,"").trim(),
              m.split("/")[0].trim(), m.split("又称")[0].trim(),
              m.replace(/\s+/g,""), "细胞"+m,
              e, e.trim(), en, en.toUpperCase(),
              en.replace(/s$/i,""), en.replace(/es$/i,"")];
  for(const k of keys){ if(k && NOTES[k]) return esc(NOTES[k]); }
  return "";
}
function $(sel){ return document.querySelector(sel); }
const app = document.getElementById("app");
function setView(cls){ app.className = cls || ""; }
function setAccent(bid){ document.documentElement.style.setProperty('--accent', DATA[bid].accent); }

/* ============ 会话 ============ */
let sess = null;
function startSession(bid, mode, ids, pos){
  const r = state[bid].newRound;
  // 同一轮词书队列才恢复作答缓存，换书 / 新一轮一律从干净状态开始
  const resume = mode==="study" && r && !r.done && r.ids
                 && r.ids.length===ids.length && r.ids.join("|")===ids.join("|");
  sess = { bid, mode, queue: ids, pos: pos||0,
           answered:  resume && r.answered   ? cp(r.answered)   : {},
           opts:      resume && r.opts       ? cp(r.opts)       : {},
           cards:     resume && r.cards      ? cp(r.cards)      : {},
           cardsOrder:resume && r.cardsOrder ? cp(r.cardsOrder) : [],
           recheck:null };
  renderStudy();
}
function currentTerm(){ return DATA[sess.bid]._terms.find(t=>t._id===sess.queue[sess.pos]); }

/* ---------- 背新词：按单元顺序的连续队列 + 断点续背 ---------- */
/* state[bid].newRound = { ids:[本轮全部词], pos:已背到第几个, done:本轮是否完成 } */
function planNew(bid){
  const r = state[bid].newRound;
  if(r && !r.done && r.ids && r.ids.length && r.pos < r.ids.length){
    return { ids:r.ids, pos:r.pos, label:"继续上次" };
  }
  const ids = pendingIds(bid);          // 按章节顺序，只挑还没掌握的
  if(!ids.length) return { empty:true };
  state[bid].newRound = { ids, pos:0, done:false }; saveState();
  return { ids, pos:0, label:"新的一轮" };
}
function startNew(bid){
  const plan = planNew(bid);
  if(plan.empty){ return renderAllDone(bid); }
  startSession(bid,"study",plan.ids,plan.pos);
}
function savePos(){
  if(!sess || sess.mode!=="study") return;
  // 连「已答了哪题 / 选了什么 / 选项顺序 / 可改判卡片」一起存，
  // 这样答完不翻页就退出，回来仍是已答状态，不会当成没背过。
  state[sess.bid].newRound = {
    ids:sess.queue, pos:sess.pos, done:false,
    answered:cp(sess.answered), opts:cp(sess.opts),
    cards:cp(sess.cards), cardsOrder:cp(sess.cardsOrder)
  };
  saveState();
}
function finishRound(){
  if(!sess || sess.mode!=="study") return;
  state[sess.bid].newRound = { ids:sess.queue, pos:sess.queue.length, done:true };
  saveState();
}

/* ---------- 复习会话：循环队列 ---------- */
/* queue = [{id, ph}]，ph: judge(只给单词+会/不会) | quiz(记错词强化选择题) */
function startReview(bid){
  const ids = dueIds(bid);
  if(!ids.length){ return renderEmptyReview(bid); }
  sess = {
    bid, mode:"review",
    queue: ids.map(id=>({id, ph:"judge"})),
    ans:null, opts:{}, cards:{}, cardsOrder:[], recheck:null,
    total:ids.length, passed:0, loops:0, overdue:overdueCount(bid)
  };
  renderReview();
}
function reviewTerm(){ return DATA[sess.bid]._terms.find(t=>t._id===sess.queue[0].id); }

/* ---------- 「撤回」= 返回上一页改判 ----------
   不是撤销某次点击，而是回到最近一张已完成的卡片，
   让你把「蒙对 / 点了会」改判成「记错了」。
   每题完成时记下作答前的进度；进入改判态即回滚该题已写入的
   localStorage 记录，最后由「保持原判 / 改成记错了」决定写回什么。 */
function cp(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
function snapSess(){
  return {
    queue:cp(sess.queue), pos:sess.pos, answered:cp(sess.answered), ans:cp(sess.ans), opts:cp(sess.opts),
    passed:sess.passed, loops:sess.loops, total:sess.total, overdue:sess.overdue,
    newRound:cp(state[sess.bid].newRound)
  };
}
function recordCard(id, c){
  if(!sess.cards) sess.cards={};
  if(!sess.cardsOrder) sess.cardsOrder=[];
  sess.cards[id]=c;
  sess.cardsOrder.push(id);            // 末项 = 最近完成的一题
  if(sess.cardsOrder.length>300) sess.cardsOrder.shift();
}
function canUndo(){
  if(!sess || sess.recheck) return false;
  if(sess.mode==="review") return !!(sess.cardsOrder && sess.cardsOrder.length);
  const cur=sess.queue[sess.pos];
  const idx=sess.answered[cur] ? sess.pos : sess.pos-1;
  return idx>=0 && !!sess.cards[sess.queue[idx]];
}
function openRecheck(){
  if(!sess || sess.recheck) return false;
  let id=null;
  if(sess.mode==="review"){
    if(!sess.cardsOrder || !sess.cardsOrder.length) return false;
    id=sess.cardsOrder[sess.cardsOrder.length-1];
  } else {
    const cur=sess.queue[sess.pos];
    const idx=sess.answered[cur] ? sess.pos : sess.pos-1;
    if(idx<0 || idx>=sess.queue.length) return false;
    id=sess.queue[idx];
  }
  const card=sess.cards[id];
  if(!card) return false;
  sess.recheck={ id, restore:snapSess() };
  if(card.beforeP===undefined) delete state[sess.bid].p[id];
  else state[sess.bid].p[id]=cp(card.beforeP);     // 撤销该题写入的学习记录
  if(sess.mode!=="review" && card.beforeNR!==undefined) state[sess.bid].newRound=cp(card.beforeNR);
  saveState();
  renderRecheck();
  return true;
}
function replayCard(bid,id,card){
  const r=(card&&card.result)||{};
  if(card.ph==="study"){ record(bid,id,!!r.correct); return; }
  if(r.kind==="pass"){ reviewPass(bid,id,r.know!==false); return; }
  reviewMissReset(bid,id);
}
function doRecheck(miss){
  if(!sess || !sess.recheck) return;
  const {id,restore}=sess.recheck, bid=sess.bid;
  const card=sess.cards[id]||{};
  sess.queue=restore.queue; sess.pos=restore.pos; sess.answered=restore.answered;
  sess.ans=restore.ans; sess.opts=restore.opts||{};
  if(restore.passed!==undefined) sess.passed=restore.passed;
  if(restore.loops!==undefined) sess.loops=restore.loops;
  if(restore.total!==undefined) sess.total=restore.total;
  if(restore.overdue!==undefined) sess.overdue=restore.overdue;
  state[bid].newRound=restore.newRound;
  if(miss){
    if(sess.mode==="review"){
      reviewMissReset(bid,id);
      if(!sess.queue.some(q=>q.id===id)) sess.queue.push({id, ph:"quiz", miss:true, quizDone:false});
      sess.cards[id]={ph:card.ph, result:{know:false, correct:false, kind:"wrong"},
        beforeP:cp(card.beforeP), afterP:cp(state[bid].p[id])};
    } else {
      record(bid,id,false);
      sess.answered[id]={choice:-1, correct:false, skip:true};
      sess.cards[id]={ph:"study", result:{correct:false, skip:true},
        beforeP:cp(card.beforeP), beforeNR:cp(card.beforeNR), afterP:cp(state[bid].p[id])};
    }
  } else {
    if(card.afterP!==undefined) state[bid].p[id]=cp(card.afterP);  // 逐字段还原撤回前
    else replayCard(bid,id,card);
  }
  sess.recheck=null;
  saveState(); savePos();
  (sess.mode==="review" ? renderReview() : renderStudy());
}

/* ============ 「上一页」改判卡片：显示词义 + 保持/改判两个按钮 ============ */

/* 只有「下一张」推进队列；「↻ 记错了」只改判（sess.ans.miss），不翻页。
   点「不会」本身就是记错，无需再点一次按钮，本轮自动进强化循环。 */
function reviewAdvance(){
  if(!sess || sess.mode!=="review" || !sess.queue.length || !sess.ans) return;
  const bid = sess.bid;
  const item = sess.queue.shift();
  const a = sess.ans;
  const miss = !!a.miss || (item.ph==="judge" && a.know===false);
  const kind = miss ? "wrong" : "pass";
  recordCard(item.id, { ph:item.ph,
    result:{ know:a.know, correct:a.correct, kind:kind },
    beforeP:cp(state[bid].p[item.id]) });
  if(item.ph==="judge"){
    if(kind==="pass"){
      reviewPass(bid, item.id, a.know);
      sess.passed++;
    } else {
      reviewMissReset(bid, item.id);
      sess.queue.push({ id:item.id, ph:"quiz", miss:true, quizDone:false }); // 记错词必须先考选择题
      sess.loops++;
    }
  } else { // quiz：只有「选对 + 没被改判 + 下一张」才放行到 judge
    if(kind==="pass" && a.correct) sess.queue.push({ id:item.id, ph:"judge", miss:true, quizDone:true });
    else sess.queue.push({ id:item.id, ph:"quiz", miss:true, quizDone:false });
    sess.loops++;
  }
  if(sess.cards[item.id]) sess.cards[item.id].afterP = cp(state[bid].p[item.id]);
  sess.ans = null;
  renderReview();
}

/* 生成 4 个选项（1 正确 + 3 干扰）；同一会话内缓存，顺序恒定 */
function buildOptions(term){
  const pool = DATA[term._bid]._terms.filter(t=>t._id!==term._id && t.m!==term.m).map(t=>t.m);
  const wrongs = shuffle(pool).slice(0,3);
  while(wrongs.length<3) wrongs.push("（暂无更多干扰项）");
  return shuffle([term.m, ...wrongs]);
}
function optionsFor(term){
  if(!sess.opts) sess.opts = {};
  if(!sess.opts[term._id]) sess.opts[term._id] = buildOptions(term);
  return sess.opts[term._id];
}

const QUOTES = [
  {q:"Fall seven times, stand up eight.", sub:"七次跌倒，第八次站起来。", by:"日本谚语"},
  {q:"Energy and persistence conquer all things.", sub:"能量与坚持，可以征服一切。", by:"Benjamin Franklin"},
  {q:"It always seems impossible until it's done.", sub:"在完成之前，一切看起来都不可能。", by:"Nelson Mandela"},
  {q:"Success is the sum of small efforts, repeated day in and day out.", sub:"成功，是日复一日微小努力的累加。", by:"Robert Collier"},
  {q:"不积跬步，无以至千里。", sub:"A journey of a thousand miles begins with a single step.", by:"荀子《劝学》"},
  {q:"The secret of getting ahead is getting started.", sub:"前进的秘诀，就是先开始。", by:"Mark Twain"},
  {q:"行百里者半九十。", sub:"越接近终点，越要坚持住。", by:"《战国策》"}
];
function pickQuote(){
  const pool=[];
  for(let i=0;i<QUOTES.length;i++) if(i!==state.lastQuote) pool.push(i);
  const i = pool.length ? pool[Math.floor(Math.random()*pool.length)] : 0;
  state.lastQuote=i; saveState();
  return QUOTES[i];
}

/* ============ 复习页 ============ */
function renderReview(){
  if(sess.recheck) return renderRecheck();
  const bid=sess.bid;
  setAccent(bid); setView("sess");
  if(!sess.queue.length){ return renderReviewDone(); }
  const item=sess.queue[0];
  // 硬保护：记错词没通过选择题之前，绝不渲染成纯判断模式
  if(item.miss && !item.quizDone) item.ph="quiz";
  const term=DATA[bid]._terms.find(t=>t._id===item.id);
  if(!term){ sess.queue.shift(); return renderReview(); }
  const p=getP(bid,item.id);
  const ans=sess.ans;
  const keys=['A','B','C','D'];
  let slot='', foot='', modeLabel='';
  const isQuiz = item.ph==="quiz";
  const statLine = '按遗忘曲线按天安排'
    + (sess.overdue ? ' · 含往日顺延 <b>'+sess.overdue+'</b> 词' : '')
    + (sess.loops ? ' · 循环巩固 '+sess.loops+' 次' : '');
  const rvstat = isQuiz ? '' : '<div class="rvstat">'+statLine+'</div>';

  if(item.ph==="judge"){
    modeLabel = "纯判断 · 只想单词";
    if(!ans){
      slot = `<div class="judgerow">
        <button class="judge yes" data-act="judge" data-v="1">✓ 会<small>记得这个意思</small></button>
        <button class="judge no" data-act="judge" data-v="0">✗ 不会<small>想不起来了</small></button>
      </div>`;
      foot = `<div class="footbar"><div class="footnote">先自己想，再对答案 · 不显示释义与选项</div></div>`;
    } else {
      const marked = !!ans.miss;                       // 已把「蒙对了」改判成记错了
      const canMark = ans.know && !marked;             // 只有点「会」才需要改判；点「不会」已经是记错
      const rst = marked ? '↻ 已改成「记错了」· 等会儿先考你选择题'
        : ans.know ? '✓ 记得没错，继续保持'
                   : '✗ 没想起来 · 本轮稍后先考你选择题';
      // 释义就地展开在原判断按钮的位置
      slot = `<div class="defbox">
        <div class="dk">DEFINITION · 释义</div>
        <div class="zh"><mark>${esc(term.m)}</mark></div>
        <div class="tip">${esc(term.e)} ${esc(term.p&&term.p!=='/'?term.p:'')}</div>
        <div class="rst ${(ans.know&&!marked)?'':'bad'}">${rst}</div>
        <div class="extra"><b>✎ 小注</b> ${briefNote(term)}</div>
      </div>`;
      foot = `<div class="footbar">
        ${canMark
          ? `<button class="btn sec rv-wrong" data-act="rv-mark-miss">↻ 记错了</button>`
          : `<div class="rvflag">${marked?'↻ 已改判 · 不翻页':'✗ 已记下 · 稍后强化'}</div>`}
        <button class="btn primary" data-act="rv-next">下一张 ›</button>
      </div>`;
    }
  } else {
    modeLabel = "记错强化 · 选出释义";
    const opts=optionsFor(term);
    if(!ans){
      opts.forEach((o,i)=>{
        slot += `<button class="opt" data-act="quiz-choose" data-i="${i}" data-k="${keys[i]}" data-m="${esc(o)}">${esc(o)}</button>`;
      });
      foot = `<div class="footbar"><div class="footnote">🔁 刚才记错了 · 从 4 个释义里挑出正确的</div></div>`;
    } else {
      opts.forEach((o,i)=>{
        let cls='opt';
        if(o===term.m) cls += (ans.correct?' ok':' miss');
        else if(i===ans.choice && !ans.correct) cls+=' bad';
        else cls+=' dim';
        slot += `<button class="${cls}" data-k="${keys[i]}" disabled>${esc(o)}</button>`;
      });
      slot += `<div class="answerbar ${(ans.correct&&!ans.miss)?'':'bad'}">
        <span class="lbl">释义</span><span class="val"><mark>${esc(term.m)}</mark></span>
        <span class="st ${(ans.correct&&!ans.miss)?'ok':'bad'}">${ans.miss?'↻ 已改成记错了 · 再练一次':ans.correct?'✓ 选对了，再默想一次':'✗ 再看一眼，待会儿重考'}</span></div>`;
      foot = `<div class="footbar">
        ${ans.miss
          ? `<div class="rvflag">↻ 已改判 · 不翻页</div>`
          : `<button class="btn sec rv-wrong" data-act="rv-mark-miss">↻ 记错了</button>`}
        <button class="btn primary" data-act="rv-next">${(ans.correct&&!ans.miss)?'进入回忆 ›':'再练一次 ›'}</button>
      </div>`;
    }
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="back" data-act="home">‹</button>
      <div class="title">复习 · ${DATA[bid].title}</div>
      <div class="meta">剩余 ${sess.queue.length}</div>
      <button class="undo" data-act="undo" title="返回上一页，可把蒙对的改成记错了" ${canUndo()?'':'disabled'}>↶ 撤回</button>
    </div>
    <div class="progwrap">
      <div class="prog"><span class="mode">${modeLabel}</span><span>已完成 ${sess.passed}/${sess.total}</span></div>
      <div class="bar"><i style="width:${Math.round(sess.passed/Math.max(sess.total,1)*100)}%"></i></div>
    </div>
    ${rvstat}
    <div class="scroll">
      <div class="paper wordcard${isQuiz?' compact':''}">
        <span class="tape o"></span>
        <button class="star ${p.fav?'on':''}" data-act="fav-toggle" title="收藏">${p.fav?'★':'☆'}</button>
        <div class="kicker">${item.ph==='judge'?'Recall · 回忆':'Reinforce · 巩固'}</div>
        <div class="en ${term.e.length>40?'l':term.e.length>26?'m':''}">${esc(term.e)}</div>
        ${term.p&&term.p!=='/'?`<div class="ph">${esc(term.p)}</div>`:''}
        <span class="ill illcorner">${ILL[bid==='cell'?'petri':'dna']}</span>
      </div>
      <div class="slot${isQuiz?' quizslot':''}">${slot}</div>
      <div class="spacer" style="height:${isQuiz?4:12}px"></div>
    </div>
    ${foot}`;
}

/* ============ 结果 / 空状态页 ============ */

  const bid=sess.bid, b=DATA[bid];
  setView("");
  let correct=0,total=0;
  sess.queue.forEach(id=>{ const a=sess.answered[id]; if(a){ total++; if(a.correct) correct++; } });
  const acc = total? Math.round(correct/total*100):0;
  const m = masteryOf(bid);
  app.innerHTML = `
    <div class="scroll"><div class="done">
      <div class="em"><span class="ill" style="width:62px;height:62px;color:var(--green);margin:0 auto">${ILL.leaf}</span></div>
      <h2>本轮完成！</h2>
      <p>${b.title} · 本次答对 ${correct}/${total}（${acc}%）</p>

    </div></div>`;
}
