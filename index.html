<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生物专业英语卡片 · 细胞生物学 / 生物化学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Ma+Shan+Zheng&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* —— 手账纸感配色 —— */
    --paper:#F7F9F4;          /* 柔和浅米底色 */
    --card:#FCFDFA;           /* 卡片纸 */
    --ink:#37402f;            /* 墨绿黑 */
    --ink-soft:#7c8572;       /* 次要文字 */
    --green:#429958;          /* 主色 清新自然绿 */
    --green-deep:#2f7d4f;
    --orange:#E67A38;         /* 点缀暖橘 */
    --bad:#d9594c;            /* 答错/没记住 红 */
    --line:#c9d3c2;           /* 手绘细线 */
    --tape:#42995826;         /* 胶带绿 */
    --tape-o:#E67A3822;       /* 胶带橘 */
    --hl:#fdf2b0;             /* 荧光高亮 */
    --hand:"Ma Shan Zheng", "Kalam", "Caveat", cursive;
    --hand-en:"Caveat", "Kalam", cursive;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    /* 淡淡笔记压痕（横线）+ 极淡网格 */
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 30px, #6e8a6e10 30px, #6e8a6e10 31px),
      repeating-linear-gradient(90deg, transparent, transparent 30px, #6e8a6e08 30px, #6e8a6e08 31px);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  #app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  /* 宽屏（平板横屏）容器加宽，两侧留白交给装饰层 */
  @media (min-width:760px){
    #app{max-width:880px;}
    .hero{padding:24px 30px 6px;}
    .hero h1{font-size:30px;}
    .hero .sub{font-size:15px;max-width:70%;}
    .bookcard{margin:20px 30px;padding:24px 26px;}
    .bookcard .bt .bn{font-size:21px;}
    .bookcard .bt .ba{font-size:12.5px;}
    .bookcard .badge{width:58px;height:58px;font-size:28px;}
    .bookcard .illbox{width:64px;height:80px;right:26px;top:18px;}
    .chap{margin:13px 30px;padding:17px 20px;}
    .chap .cn .t{font-size:16.5px;}
    .home-actions{margin:8px 30px 0;}
    .ghost{font-size:14.5px;padding:14px;}
    .topbar{padding:18px 26px 6px;}
    .topbar .title{font-size:19px;}
    .progwrap{padding:10px 30px 0;}
    .wordcard{margin:14px 30px;padding:34px 34px 28px;}
    .wordcard .en{font-size:44px;}
    .wordcard .en.m{font-size:33px;}
    .wordcard .en.l{font-size:26px;}
    .wordcard .kicker{font-size:17px;}
    .wordcard .ph{font-size:17px;}
    .wordcard .illcorner{width:76px;height:94px;right:26px;bottom:20px;}
    .opt{margin:13px 30px 0;padding:18px 22px 18px 26px;font-size:17.5px;}
    .opt::before{width:25px;height:25px;line-height:25px;font-size:15px;}
    .dontknow{width:calc(100% - 60px);margin:16px 30px 0;padding:15px;font-size:15px;}
    .reveal{margin:16px 30px 0;padding:18px 22px;}
    .reveal .rm{font-size:17px;}
    .nextrow{margin:18px 30px 8px;gap:14px;}
    .btn{padding:17px;font-size:17px;}
    .banner{margin:14px 30px;}
    .favitem{margin:13px 30px;padding:16px 18px;}
    .chaphead{margin:8px 30px 2px;}
    .reset{margin:22px 30px;}
  }


  /* —— 通用手账纸卡（随性手绘边线） —— */
  .paper{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:255px 14px 225px 16px/16px 225px 14px 255px;
    box-shadow:0 1px 0 #00000003, 0 7px 20px #3c5a3c0d;
    position:relative;
  }
  /* 胶带贴纸 */
  .tape{position:absolute;width:90px;height:26px;top:-13px;left:22px;z-index:3;
    background:var(--tape);
    background-image:repeating-linear-gradient(90deg,#ffffff22 0 6px,transparent 6px 12px);
    border-left:1px dashed #ffffff88;border-right:1px dashed #ffffff88;
    transform:rotate(-3deg);box-shadow:0 1px 2px #0000000d;}
  .tape.o{background:var(--tape-o);background-image:repeating-linear-gradient(90deg,#ffffff22 0 6px,transparent 6px 12px);}
  .tape.r{right:-14px;left:auto;top:24px;width:24px;height:78px;transform:rotate(4deg);
    background-image:repeating-linear-gradient(0deg,#ffffff22 0 6px,transparent 6px 12px);}

  /* 大写知识点分类标签 */
  .tag{display:inline-block;font-family:var(--hand-en);font-weight:700;letter-spacing:2.5px;
    text-transform:uppercase;font-size:13px;color:#fff;background:var(--green);
    padding:3px 11px;border-radius:4px;transform:rotate(-2deg);box-shadow:0 1px 2px #00000012;}
  .tag.o{background:var(--orange);}
  .tag.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green);}

  /* 手写批注 */
  .scribble{font-family:var(--hand);color:var(--ink-soft);font-size:15px;line-height:1.5;
    transform:rotate(-1.5deg);}
  .scribble.o{color:var(--orange);}

  /* —— 便利贴（sticky note） —— */
  .sticky{
    position:relative;padding:14px 16px 16px;font-size:13.5px;line-height:1.65;
    background:#FBF7C9;color:#5d5a34;
    box-shadow:0 6px 14px #00000012, inset 0 -18px 22px #00000005;
    transform:rotate(-1.2deg);
  }
  /* 左下折角 */
  .sticky::after{content:"";position:absolute;right:0;bottom:0;width:16px;height:16px;
    background:linear-gradient(135deg, transparent 50%, #e0daa8 50%);}
  .sticky.green{background:#E4F2E5;color:#2f5a37;}
  .sticky.green::after{background:linear-gradient(135deg, transparent 50%, #c4ddc8 50%);}
  .sticky.orange{background:#FCEADB;color:#8a4a1f;}
  .sticky.orange::after{background:linear-gradient(135deg, transparent 50%, #f0d0b2 50%);}
  .sticky.pink{background:#FBE3E4;color:#8a4040;}
  .sticky.pink::after{background:linear-gradient(135deg, transparent 50%, #f0c6c8 50%);}
  /* 图钉 */
  .pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ff8a5c, var(--orange) 62%, #b8571f);
    box-shadow:0 2px 4px #0000002e;}
  .sticky .pin-t{display:block;font-family:var(--hand);font-size:15px;font-weight:700;margin-bottom:4px;}

  /* —— 错词本 / 复习卡 —— */
  .panel{margin:14px 16px;padding:16px 18px;}
  .panel .ph2{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .panel .ph2 .ttl{font-weight:800;font-size:15px;}
  .panel .ph2 .num{font-family:var(--hand-en);font-size:14px;color:var(--ink-soft);}
  .wrongrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .chip{font-size:12.5px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--line);
    color:var(--ink-soft);background:var(--card);font-family:var(--hand-en);letter-spacing:.3px;}
  .chip b{color:var(--bad);font-family:inherit;}
  .chip.ok b{color:var(--green-deep);}


  /* 线描插画 */
  .ill{display:block;}
  .ill svg{display:block;width:100%;height:100%;}
  .deco{position:absolute;pointer-events:none;opacity:.85;}

  /* —— 顶栏 —— */
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;}
  .topbar .back{font-size:22px;color:var(--green-deep);background:none;border:none;cursor:pointer;
    width:38px;height:38px;line-height:34px;text-align:center;border-radius:50%;flex:0 0 auto;font-weight:700;}
  .topbar .back:active{background:#42995814;}
  .topbar .title{font-size:17px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.5px;}
  .topbar .meta{font-size:12px;color:var(--ink-soft);flex:0 0 auto;font-family:var(--hand-en);letter-spacing:1px;}

  .pad{padding:0 16px;}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* —— 首页 —— */
  .hero{padding:16px 18px 2px;position:relative;}
  .hero h1{font-size:25px;margin:0 0 6px;font-weight:900;letter-spacing:.5px;}
  .hero .sub{color:var(--ink-soft);font-size:13.5px;line-height:1.7;margin:0;max-width:88%;}
  .hero .deco{right:14px;top:6px;width:62px;height:78px;color:var(--green);opacity:.55;}
  .hero .stamp{position:absolute;right:16px;bottom:-6px;color:var(--orange);opacity:.85;transform:rotate(8deg);width:54px;height:54px;}

  .bookcard{margin:16px;padding:18px 16px 16px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:.12s;}
  .bookcard:active{transform:scale(.99);}
  .bookcard .row1{display:flex;align-items:center;gap:13px;}
  .badge{width:50px;height:50px;border-radius:15px 6px 15px 6px/6px 15px 6px 15px;display:flex;align-items:center;justify-content:center;
    font-size:24px;color:#fff;flex:0 0 auto;box-shadow:0 2px 6px #0000001a;transform:rotate(-2deg);}
  .bookcard .bt{flex:1;min-width:0;}
  .bookcard .bt .bn{font-size:18px;font-weight:800;letter-spacing:.3px;}
  .bookcard .bt .ba{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .bookcard .illbox{position:absolute;right:16px;top:14px;width:48px;height:60px;color:var(--green);opacity:.5;}
  .bar{height:9px;border-radius:7px;background:#e7ebe2;overflow:hidden;border:1px solid #dde3d6;}
  .bar > i{display:block;height:100%;border-radius:7px;
    background:repeating-linear-gradient(45deg,var(--green) 0 6px,#5bb072 6px 12px);}
  .bookcard .stat{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);font-family:var(--hand-en);letter-spacing:.5px;}
  .bookcard .stat b{color:var(--ink);font-weight:700;font-family:inherit;}
  .bookcard .tagline{display:flex;align-items:center;gap:8px;}

  /* —— 章节列表 —— */
  .chaphead{display:flex;align-items:center;justify-content:space-between;margin:6px 16px 2px;}
  .chap{margin:11px 16px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.12s;}
  .chap:active{transform:scale(.99);}
  .chap .dot{width:30px;height:30px;flex:0 0 auto;color:var(--green);opacity:.7;}
  .chap .cn{flex:1;min-width:0;}
  .chap .cn .t{font-size:15px;font-weight:700;}
  .chap .cn .s{font-size:12px;color:var(--ink-soft);margin-top:4px;font-family:var(--hand-en);letter-spacing:.5px;}
  .chap .go{color:var(--green-deep);font-size:20px;flex:0 0 auto;font-weight:700;}

  .home-actions{display:flex;gap:10px;margin:6px 16px 0;flex-wrap:wrap;}
  .ghost{flex:1;min-width:140px;background:var(--card);border:2px solid var(--line);border-radius:14px 5px 14px 5px/5px 14px 5px 14px;
    padding:12px;font-size:13.5px;color:var(--ink-soft);text-align:center;cursor:pointer;font-weight:600;}
  .ghost:active{background:#42995810;}

  /* —— 学习页 —— */
  .progwrap{padding:8px 16px 0;}
  .prog{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);margin-bottom:6px;
    font-family:var(--hand-en);letter-spacing:.8px;}
  .prog .mode{font-family:var(--hand);font-size:14px;color:var(--green-deep);}

  .wordcard{margin:10px 16px;padding:26px 22px 22px;}
  .wordcard .kicker{font-family:var(--hand-en);font-size:15px;color:var(--orange);letter-spacing:2px;text-transform:uppercase;}
  .wordcard .en{font-size:33px;font-weight:800;line-height:1.15;margin:4px 0 4px;letter-spacing:.3px;word-break:break-word;}
  /* 长术语自适应字号，避免挤成一团 */
  .wordcard .en.m{font-size:25px;line-height:1.28;}
  .wordcard .en.l{font-size:20px;line-height:1.32;font-weight:700;}
  .wordcard .ph{font-size:15px;color:var(--ink-soft);margin-bottom:4px;font-family:var(--hand-en);}
  .wordcard .illcorner{position:absolute;right:16px;bottom:14px;width:54px;height:68px;color:var(--green);opacity:.42;}
  .star{position:absolute;top:16px;right:16px;font-size:26px;cursor:pointer;color:#c4ccc0;background:none;border:none;line-height:1;
    transition:.15s;filter:drop-shadow(0 1px 1px #00000010);}
  .star.on{color:var(--orange);transform:rotate(8deg) scale(1.05);}

  .opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px 5px 14px 6px/6px 14px 5px 14px;
    padding:15px 16px;margin:11px 16px 0;font-size:16px;color:var(--ink);cursor:pointer;transition:.12s;line-height:1.4;position:relative;}
  .opt:active{background:#4299580d;transform:translateY(1px);}
  .opt::before{content:attr(data-k);position:absolute;left:-9px;top:50%;transform:translateY(-50%) rotate(-4deg);
    font-family:var(--hand-en);font-weight:700;font-size:14px;color:#fff;background:var(--green);
    width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;box-shadow:0 1px 2px #00000022;}
  .opt.ok{border-color:var(--green);background:#ecf6ee;color:#1f6b3a;font-weight:700;}
  .opt.ok::before{background:var(--green);}
  .opt.bad{border-color:var(--bad);background:#fbecea;color:#b23a2c;font-weight:700;}
  .opt.bad::before{background:var(--bad);}
  .opt.miss{border-color:var(--bad);background:#fdf0ec;color:#c0492f;font-weight:700;
    background-image:repeating-linear-gradient(45deg,#fbecea 0 7px,#fdf0ec 7px 14px);}
  .opt.miss::before{background:var(--bad);}
  .opt.dim{opacity:.5;}
  .opt:disabled{cursor:default;}

  .dontknow{width:calc(100% - 32px);margin:13px 16px 0;background:#fffaf0;border:2px dashed var(--orange);border-radius:13px;
    padding:13px;font-size:14px;color:var(--orange);cursor:pointer;font-weight:700;letter-spacing:.5px;}
  .dontknow:active{background:#fff3e2;}

  .reveal{margin:13px 16px 0;padding:14px 16px;background:#f4f8ef;border:2px solid var(--line);
    border-radius:14px 6px 14px 6px/6px 14px 6px 14px;font-size:14px;line-height:1.65;position:relative;}
  .reveal .rt{font-weight:800;color:var(--green-deep);margin-bottom:5px;font-size:15px;}
  .reveal .rt.bad{color:var(--bad);}
  .reveal .rm{font-size:15.5px;}
  .reveal .rn{color:var(--ink-soft);font-size:13px;margin-top:7px;font-family:var(--hand-en);letter-spacing:.5px;}
  mark{background:linear-gradient(transparent 52%, var(--hl) 52%);color:inherit;padding:0 3px;border-radius:2px;font-weight:700;}

  .nextrow{display:flex;gap:10px;margin:15px 16px 6px;}
  .btn{flex:1;border:none;border-radius:14px 5px 14px 5px/5px 14px 5px 14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.5px;}
  .btn.primary{background:var(--green);color:#fff;box-shadow:0 3px 0 #2f7d4f;}
  .btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #2f7d4f;}
  .btn.sec{flex:0 0 44%;background:var(--card);border:2px solid var(--line);color:var(--ink);}
  .btn.sec:active{background:#4299580d;}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none;}

  /* 复习提示条 */
  .banner{margin:12px 16px;padding:12px 14px;border-radius:12px 4px 12px 4px/4px 12px 4px 12px;
    background:#fff4e2;color:#a9601f;font-size:13px;line-height:1.55;border:2px dashed var(--orange);position:relative;}

  /* 收藏列表 */
  .favitem{margin:11px 16px;padding:13px 15px;display:flex;align-items:center;gap:12px;}
  .favitem .fe{flex:1;min-width:0;}
  .favitem .fe .e{font-size:16px;font-weight:800;}
  .favitem .fe .m{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .favitem .x{color:var(--bad);font-size:20px;cursor:pointer;background:none;border:none;width:34px;height:34px;}

  .done{text-align:center;padding:30px 24px;}
  .done .em{font-size:50px;}
  .done h2{font-size:22px;margin:10px 0 4px;font-weight:900;}
  .done p{color:var(--ink-soft);font-size:14px;margin:5px 0 16px;font-family:var(--hand-en);letter-spacing:.5px;}
  .center-note{text-align:center;color:var(--ink-soft);padding:40px 24px;font-size:14px;line-height:1.7;}
  .reset{margin:18px 16px;font-size:12px;color:#aeb6a4;text-align:center;cursor:pointer;font-family:var(--hand-en);letter-spacing:1px;}
  .reset:active{color:var(--bad);}

  .spacer{height:22px;}

  /* ================= v2：布局稳定 / 首页 / 复习 ================= */
  /* 学习&复习页：视口固定高度，滚动只发生在 .scroll 内，底栏永远不动 */
  #app.sess{height:100vh;height:100dvh;min-height:0;overflow:hidden;}
  #app.sess .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .footbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1.5px dashed var(--line);}
  .footbar .btn{margin:0;height:54px;display:flex;align-items:center;justify-content:center;padding:0 12px;}
  .footbar .btn.rv-wrong{border-color:#e2a79c;color:var(--bad);}
  /* 背新词：「我选不会」移进底栏，与下一题/完成同一行 */
  .footbar .btn.miss{flex:0 0 42%;background:#fffaf0;border:2px dashed var(--orange);
    color:var(--orange);font-size:14px;font-weight:800;}
  .footbar .btn.miss:active{background:#fff3e2;}
  .footbar .btn.miss:disabled{opacity:.42;cursor:default;background:#fffaf0;}
  /* 「上一页」改判态：保持原判 / 改成记错了 */
  .footbar .btn.keep{flex:1;}
  .footbar .btn.danger{flex:1;border-color:#e2a79c;background:#fdf1ee;color:var(--bad);font-weight:800;}
  .footbar .btn.danger:active{background:#fbe4df;}
  /* topbar 右上角「撤回」 */
  .topbar .undo{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--green-deep);
    font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:18px;cursor:pointer;white-space:nowrap;}
  .topbar .undo:active{background:#42995810;}
  .topbar .undo:disabled{opacity:.35;cursor:default;}
  /* 提示态与按钮态占用同一高度，底栏位置恒定 */
  .footnote{flex:1;height:54px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:12px;color:var(--ink-soft);font-family:var(--hand-en);letter-spacing:.4px;}

  /* 固定槽位：选项 / 判断 / 释义都在同一区域内就地替换，不新增占位行 */
  .slot{margin:11px 16px 0;min-height:320px;display:flex;flex-direction:column;justify-content:center;}
  .slot > .opt{margin:0 0 9px;}
  .slot > .answerbar,.slot > .defbox,.slot > .judgerow{margin:3px 0 0;}
  /* 揭晓答案后释义框上移，紧跟单词卡，别沉在页面中下部（纯视觉位移，不改文档流） */
  .slot > .defbox{transform:translateY(-44px);}
  /* 选完后只剩一个展示框，高度固定，避免撑开页面 */
  .defbox.study-def{min-height:176px;display:flex;flex-direction:column;justify-content:center;}
  .defbox .extra{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.6;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;}
  .defbox .extra b{color:var(--green-deep);font-weight:800;}
  .answerbar{height:48px;min-height:0;overflow:hidden;display:flex;align-items:center;gap:9px;
    background:#f2f7ee;border:2px solid var(--line);border-radius:13px;padding:0 13px;font-size:13.5px;line-height:1.45;}
  .answerbar.bad{background:#fdf1ee;border-color:#e8bcb3;}
  .answerbar .lbl{font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;font-family:var(--hand-en);letter-spacing:1px;}
  .answerbar .val{font-weight:800;font-size:15.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .answerbar .st{margin-left:auto;font-size:12.5px;font-weight:800;flex:0 0 auto;}
  .answerbar .st.ok{color:var(--green-deep);}

  .judge:active{transform:translateY(1px);}
  .judge.yes{border-color:var(--green);color:var(--green-deep);background:#f0f8f1;}
  .judge.no{border-color:#e2a79c;color:var(--bad);background:#fdf4f1;}
  .judge:disabled{opacity:.42;cursor:default;transform:none;}
  .judge small{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:6px;}
  .defbox{background:var(--card);border:2px solid var(--line);border-radius:14px 6px 14px 6px/6px 14px 6px 14px;

  .defbox .dk{font-family:var(--hand-en);font-size:12px;letter-spacing:2px;color:var(--orange);}
  .defbox .zh{font-size:24px;font-weight:800;line-height:1.4;margin:6px 0 4px;}
  .defbox .tip{font-size:12.5px;color:var(--ink-soft);font-family:var(--hand-en);}
  .defbox .rst{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:20px;
    background:#ecf6ee;color:var(--green-deep);}
  .defbox .rst.bad{background:#fbecea;color:var(--bad);}
  .rvstat{margin:8px 16px 0;font-size:12px;color:var(--ink-soft);font-family:var(--hand-en);letter-spacing:.5px;}
  .rvstat b{color:var(--orange);}

  /* —— 首页：简洁留白 —— */
  #app.home{background-color:#F9FBF6;}
  .homebg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .homebg .wash{position:absolute;right:-120px;top:-110px;width:340px;height:340px;border-radius:50%;background:#e8f2e6;opacity:.55;}
  .homebg .wash2{position:absolute;left:-90px;bottom:-70px;width:260px;height:260px;border-radius:50%;background:#fbeedd;opacity:.4;}
  .homebg .bgill{position:absolute;color:var(--green);opacity:.13;}
  .homebg .bgill.a{width:110px;height:170px;left:-24px;top:120px;transform:rotate(-12deg);}
  .homebg .bgill.b{width:120px;height:120px;right:-18px;bottom:110px;transform:rotate(14deg);color:var(--orange);opacity:.12;}
  .homebg .bgill.c{width:96px;height:96px;right:26px;top:210px;opacity:.1;}
  .homebg .bggrid{position:absolute;inset:0;background-image:radial-gradient(#7a9a7a22 1px,transparent 1px);
    background-size:22px 22px;opacity:.5;}
  .homewrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:18px 22px 22px;}
  .hometop{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .htag{font-family:var(--hand-en);font-size:13px;letter-spacing:2.5px;color:var(--green-deep);font-weight:700;}
  .pickbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:12.5px;font-weight:700;
    padding:8px 13px;border-radius:20px;cursor:pointer;box-shadow:0 2px 0 #00000008;}
  .pickbtn:active{background:#42995810;}
  .hhero{margin-top:54px;}
  .hkick{font-family:var(--hand-en);font-size:15px;letter-spacing:4px;color:var(--orange);font-weight:700;}
  .hhero h1{font-size:37px;line-height:1.24;margin:10px 0 10px;font-weight:900;letter-spacing:1px;}
  .hhero h1 em{font-style:normal;color:var(--green);background:linear-gradient(transparent 62%,var(--hl) 62%);}
  .hhero .cur{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .hhero .cur i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
  .quotecard{margin:26px 0 0;padding:22px 20px 18px;min-height:132px;display:flex;flex-direction:column;justify-content:center;}
  .quotecard .qmark{font-family:var(--hand-en);font-size:40px;line-height:.6;color:var(--orange);opacity:.7;}
  .quotecard .q{font-family:var(--hand-en);font-size:19px;line-height:1.45;font-weight:700;margin-top:6px;}
  .quotecard .sub{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .quotecard .by{font-family:var(--hand-en);font-size:12.5px;color:var(--green-deep);margin-top:8px;text-align:right;}
  .bigbtns{display:flex;flex-direction:column;gap:12px;margin-top:22px;}
  .bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    border:2px solid var(--line);border-radius:16px 6px 16px 6px/6px 16px 6px 16px;padding:16px 18px;background:var(--card);}
  .bigbtn:active{transform:translateY(1px);}
  .bigbtn .ic{width:44px;height:44px;flex:0 0 auto;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:#eaf4ea;color:var(--green-deep);}
  .bigbtn .tx{flex:1;min-width:0;}
  .bigbtn .t1{display:block;font-size:17px;font-weight:800;}
  .bigbtn .t2{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-family:var(--hand-en);letter-spacing:.3px;}

  .bigbtn.primary .t1,.bigbtn.primary .ar{color:#fff;}
  .bigbtn.primary .t2{color:#e6f3e9;}

    font-family:var(--hand-en);letter-spacing:1px;cursor:pointer;}

  .pickerhead{display:flex;align-items:center;gap:10px;padding:16px 18px 4px;}

/* ============ 状态（localStorage 持久化，两本书独立） ============ */
const STORE_KEY = "bioFlashcardsState_v1";
const CELL_LIB_VER = 2;   // 细胞生物学词库版本
let state = loadState();
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && s.cell && s.bio){
      // 词库整体替换后，旧 cell 词条 id 会错位：只清空细胞进度，生化原样保留
      if(s.cellVer !== CELL_LIB_VER){
        s.cell = {p:{}};
        s.cellVer = CELL_LIB_VER;
        localStorage.setItem(STORE_KEY, JSON.stringify(s));
      }
      return s;
    }
  }catch(e){}
  return { cell:{p:{}}, bio:{p:{}}, cellVer:CELL_LIB_VER };
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
/* 当前词书：记住上次选择，不主动重选就一直沿用 */
if(state.curBook!=="cell" && state.curBook!=="bio"){ state.curBook="cell"; saveState(); }
function curBook(){ return DATA[state.curBook] ? state.curBook : "cell"; }

/* 为每个 term 生成稳定 id */
function buildIndex(){
  for(const bid in DATA){
    DATA[bid]._terms = [];
    DATA[bid].chapters.forEach((ch,ci)=>{
      ch.terms.forEach((t,ti)=>{
        t._id = bid+"_"+ci+"_"+ti;
        t._bid = bid; t._ch = ch.name;
        DATA[bid]._terms.push(t);
      });
    });
  }
}
buildIndex();

/* ---------- 按天调度（艾宾浩斯） ---------- */
function today(){ const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
function INTERVAL(box){ const t=[1,2,4,7,15,30]; return (box>=0&&box<t.length)? t[box] : 30; } // 天
function getP(bid,id){
  return state[bid].p[id] || {c:0,w:0,box:0,due:0,fav:false,last:0,streak:0,wrong:false,lastWrong:0};
}
function saveP(bid,id,p){ state[bid].p[id]=p; saveState(); }

/* 背新词作答：答对按等级拉长间隔，答错当天就到期（可立刻进复习） */
function record(bid,id,correct){
  const p = getP(bid,id);
  p.seen = true; p.last = Date.now();
  if(correct){
    p.c++; p.box = Math.min(p.box+1,5); p.streak = (p.streak||0)+1;
    if(p.wrong && p.streak>=2) p.wrong = false;      // 连对 2 次毕业
    p.ddue = today() + INTERVAL(p.box);
  } else {
    p.w++; p.box = 0; p.streak = 0; p.wrong = true; p.lastWrong = Date.now();
    p.ddue = today();
  }
  saveP(bid,id,p);
}
/* 复习通过：会 → 交给遗忘曲线拉长间隔；不会 → 明天再来 */
function reviewPass(bid,id,know){
  if(know){ record(bid,id,true); return; }
  const p=getP(bid,id);
  p.seen=true; p.w++; p.box=0; p.streak=0; p.wrong=true; p.last=Date.now();
  p.ddue = today()+1;
  saveP(bid,id,p);
}
/* 记错了：等级清零，本轮不安排到期，等循环巩固后再交给遗忘曲线 */
function reviewMissReset(bid,id){
  const p=getP(bid,id); p.box=0; p.streak=0; p.wrong=true; saveP(bid,id,p);
}
/* 今日该复习的词：学过的 + 已到期（ddue<=今天）。
   没复习的词 ddue 不会自动推进，所以昨天的会原样累加进来，不丢失、不重置。 */
function dueIds(bid){
  const t=today();
  const arr=DATA[bid]._terms.filter(x=>{
    const p=getP(bid,x._id);
    if((p.c+p.w)<=0) return false;                 // 没学过的新词绝不进复习
    return p.ddue==null || p.ddue<=t;              // 旧进度无 ddue → 视为到期
  });
  arr.sort((a,b)=>{
    const pa=getP(bid,a._id), pb=getP(bid,b._id);
    return (pa.ddue==null?t:pa.ddue)-(pb.ddue==null?t:pb.ddue);
  });
  return arr.map(x=>x._id);
}
function overdueCount(bid){
  const t=today();
  return dueIds(bid).filter(id=>{ const p=getP(bid,id); return p.ddue!=null && p.ddue<t; }).length;
}
function isMastered(bid,id){ const p=getP(bid,id); return (p.c||0)>0 && !p.wrong; }
function pendingIds(bid){ return DATA[bid]._terms.filter(t=>!isMastered(bid,t._id)).map(t=>t._id); }
function wrongIds(bid){ return DATA[bid]._terms.filter(t=>getP(bid,t._id).wrong).map(t=>t._id); }
function wrongStat(bid){
  let n=0, weak=0;
  DATA[bid]._terms.forEach(t=>{ const p=getP(bid,t._id); if(p.wrong){ n++; if((p.streak||0)===0) weak++; } });
  return {n, weak};
}
function masteryOf(bid){
  let ans=0, tot=0;
  DATA[bid]._terms.forEach(t=>{ const p=getP(bid,t._id); if(p.c+p.w>0){ ans += p.c/(p.c+p.w); tot++; } });
  return tot? Math.round(ans/tot*100) : 0;
}
function favIds(bid){ return DATA[bid]._terms.filter(t=>getP(bid,t._id).fav).map(t=>t._id); }

/* ============ 工具 ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function briefNote(t){
  const m=String(t.m||""), e=String(t.e||"");
  for(const pair of NOTES) if(m.indexOf(pair[0])>=0) return esc(pair[1]);
  const hits=[];
  for(const pair of ROOTS) if(pair[0].test(e) && hits.length<2 && hits.indexOf(pair[1])<0) hits.push(pair[1]);
  const main=m.split(/[；;，,、（(\/]/)[0].trim() || m;
  const al=m.match(/[（(]([^）)]+)[）)]/);
  const slash=m.indexOf("/")>=0 ? m.split("/").slice(1).join("/").replace(/[（(].*?[）)]/g,"").trim() : "";
  const alias=al ? al[1] : slash;
  const core="「"+main+"」"+(alias && alias!==main ? "（又称"+alias+"）" : "");
  if(hits.length) return esc("拆词："+hits.join("、")+"。中文对应"+core+"，别和形近术语弄混。");
  return esc("重点记"+core+"这一中英对应；考试常给英文让你选释义，留意同章近义词。");
}
function $(sel){ return document.querySelector(sel); }
const app = document.getElementById("app");
function setView(cls){ app.className = cls || ""; }
function setAccent(bid){ document.documentElement.style.setProperty('--accent', DATA[bid].accent); }

/* ============ 会话 ============ */
let sess = null;
function startSession(bid, mode, ids, pos){
  sess = { bid, mode, queue: ids, pos: pos||0, answered:{}, opts:{},
           cards:{}, cardsOrder:[], recheck:null };
  renderStudy();
}
function currentTerm(){ return DATA[sess.bid]._terms.find(t=>t._id===sess.queue[sess.pos]); }

/* ---------- 背新词：按单元顺序的连续队列 + 断点续背 ---------- */
/* state[bid].newRound = { ids:[本轮全部词], pos:已背到第几个, done:本轮是否完成 } */
function planNew(bid){
  const r = state[bid].newRound;
  if(r && !r.done && r.ids && r.ids.length && r.pos < r.ids.length){
    return { ids:r.ids, pos:r.pos, label:"继续上次" };
  }
  const ids = pendingIds(bid);          // 按章节顺序，只挑还没掌握的
  if(!ids.length) return { empty:true };
  state[bid].newRound = { ids, pos:0, done:false }; saveState();
  return { ids, pos:0, label:"新的一轮" };
}
function startNew(bid){
  const plan = planNew(bid);
  if(plan.empty){ return renderAllDone(bid); }
  startSession(bid,"study",plan.ids,plan.pos);
}
function savePos(){
  if(!sess || sess.mode!=="study") return;
  state[sess.bid].newRound = { ids:sess.queue, pos:sess.pos, done:false };
  saveState();
}
function finishRound(){
  if(!sess || sess.mode!=="study") return;
  state[sess.bid].newRound = { ids:sess.queue, pos:sess.queue.length, done:true };
  saveState();
}

/* ---------- 复习会话：循环队列 ---------- */
/* queue = [{id, ph}]，ph: judge(只给单词+会/不会) | quiz(记错词强化选择题) */
function startReview(bid){
  const ids = dueIds(bid);
  if(!ids.length){ return renderEmptyReview(bid); }
  sess = {
    bid, mode:"review",
    queue: ids.map(id=>({id, ph:"judge"})),
    ans:null, opts:{}, cards:{}, cardsOrder:[], recheck:null,
    total:ids.length, passed:0, loops:0, overdue:overdueCount(bid)
  };
  renderReview();
}
function reviewTerm(){ return DATA[sess.bid]._terms.find(t=>t._id===sess.queue[0].id); }

/* ---------- 「撤回」= 返回上一页改判 ----------
   不是撤销某次点击，而是回到最近一张已完成的卡片，
   让你把「蒙对 / 点了会」改判成「记错了」。
   每题完成时记下作答前的进度；进入改判态即回滚该题已写入的
   localStorage 记录，最后由「保持原判 / 改成记错了」决定写回什么。 */
function cp(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
function snapSess(){
  return {
    queue:cp(sess.queue), pos:sess.pos, answered:cp(sess.answered), ans:cp(sess.ans), opts:cp(sess.opts),
    passed:sess.passed, loops:sess.loops, total:sess.total, overdue:sess.overdue,
    newRound:cp(state[sess.bid].newRound)
  };
}
function recordCard(id, c){
  if(!sess.cards) sess.cards={};
  if(!sess.cardsOrder) sess.cardsOrder=[];
  sess.cards[id]=c;
  sess.cardsOrder.push(id);            // 末项 = 最近完成的一题
  if(sess.cardsOrder.length>300) sess.cardsOrder.shift();
}
function canUndo(){
  if(!sess || sess.recheck) return false;
  if(sess.mode==="review") return !!(sess.cardsOrder && sess.cardsOrder.length);
  const cur=sess.queue[sess.pos];
  const idx=sess.answered[cur] ? sess.pos : sess.pos-1;
  return idx>=0 && !!sess.cards[sess.queue[idx]];
}
function openRecheck(){
  if(!sess || sess.recheck) return false;
  let id=null;
  if(sess.mode==="review"){
    if(!sess.cardsOrder || !sess.cardsOrder.length) return false;
    id=sess.cardsOrder[sess.cardsOrder.length-1];
  } else {
    const cur=sess.queue[sess.pos];
    const idx=sess.answered[cur] ? sess.pos : sess.pos-1;
    if(idx<0 || idx>=sess.queue.length) return false;
    id=sess.queue[idx];
  }
  const card=sess.cards[id];
  if(!card) return false;
  sess.recheck={ id, restore:snapSess() };
  if(card.beforeP===undefined) delete state[sess.bid].p[id];
  else state[sess.bid].p[id]=cp(card.beforeP);     // 撤销该题写入的学习记录
  if(sess.mode!=="review" && card.beforeNR!==undefined) state[sess.bid].newRound=cp(card.beforeNR);
  saveState();
  renderRecheck();
  return true;
}
function replayCard(bid,id,card){
  const r=(card&&card.result)||{};
  if(card.ph==="study"){ record(bid,id,!!r.correct); return; }
  if(r.kind==="pass"){ reviewPass(bid,id,r.know!==false); return; }
  reviewMissReset(bid,id);
}
function doRecheck(miss){
  if(!sess || !sess.recheck) return;
  const {id,restore}=sess.recheck, bid=sess.bid;
  const card=sess.cards[id]||{};
  sess.queue=restore.queue; sess.pos=restore.pos; sess.answered=restore.answered;
  sess.ans=restore.ans; sess.opts=restore.opts||{};
  if(restore.passed!==undefined) sess.passed=restore.passed;
  if(restore.loops!==undefined) sess.loops=restore.loops;
  if(restore.total!==undefined) sess.total=restore.total;
  if(restore.overdue!==undefined) sess.overdue=restore.overdue;
  state[bid].newRound=restore.newRound;
  if(miss){
    if(sess.mode==="review"){
      reviewMissReset(bid,id);
      if(!sess.queue.some(q=>q.id===id)) sess.queue.push({id, ph:"quiz", miss:true, quizDone:false});
      sess.cards[id]={ph:card.ph, result:{know:false, correct:false, kind:"wrong"},
        beforeP:cp(card.beforeP), afterP:cp(state[bid].p[id])};
    } else {
      record(bid,id,false);
      sess.answered[id]={choice:-1, correct:false, skip:true};
      sess.cards[id]={ph:"study", result:{correct:false, skip:true},
        beforeP:cp(card.beforeP), beforeNR:cp(card.beforeNR), afterP:cp(state[bid].p[id])};
    }
  } else {
    if(card.afterP!==undefined) state[bid].p[id]=cp(card.afterP);  // 逐字段还原撤回前
    else replayCard(bid,id,card);
  }
  sess.recheck=null;
  saveState(); savePos();
  (sess.mode==="review" ? renderReview() : renderStudy());
}

/* kind: "pass"(下一张) | "wrong"(记错了) */
function reviewAdvance(kind){
  if(!sess || sess.mode!=="review" || !sess.queue.length || !sess.ans) return;
  const bid = sess.bid;
  const item = sess.queue.shift();
  const a = sess.ans;
  recordCard(item.id, { ph:item.ph,
    result:{ know:a.know, correct:a.correct, kind:kind },
    beforeP:cp(state[bid].p[item.id]) });
  if(item.ph==="judge"){
    if(kind==="pass"){
      reviewPass(bid, item.id, a.know);
      sess.passed++;
    } else {
      reviewMissReset(bid, item.id);
      sess.queue.push({ id:item.id, ph:"quiz", miss:true, quizDone:false }); // 记错词必须先考选择题
      sess.loops++;
    }
  } else { // quiz：只有「选对 + 下一张」才放行到 judge；选错 / 记错一律继续 quiz
    if(kind==="pass" && a.correct) sess.queue.push({ id:item.id, ph:"judge", miss:true, quizDone:true });
    else sess.queue.push({ id:item.id, ph:"quiz", miss:true, quizDone:false });
    sess.loops++;
  }
  if(sess.cards[item.id]) sess.cards[item.id].afterP = cp(state[bid].p[item.id]);
  sess.ans = null;
  renderReview();
}

/* 生成 4 个选项（1 正确 + 3 干扰）；同一会话内缓存，顺序恒定 */
function buildOptions(term){
  const pool = DATA[term._bid]._terms.filter(t=>t._id!==term._id && t.m!==term.m).map(t=>t.m);
  const wrongs = shuffle(pool).slice(0,3);
  while(wrongs.length<3) wrongs.push("（暂无更多干扰项）");
  return shuffle([term.m, ...wrongs]);
}
function optionsFor(term){
  if(!sess.opts) sess.opts = {};
  if(!sess.opts[term._id]) sess.opts[term._id] = buildOptions(term);
  return sess.opts[term._id];
}

/* 励志短句：每次进首页随机换一条，且不与上一条重复 */
const QUOTES = [
  {q:"Fall seven times, stand up eight.", sub:"七次跌倒，第八次站起来。", by:"日本谚语"},
  {q:"Energy and persistence conquer all things.", sub:"能量与坚持，可以征服一切。", by:"Benjamin Franklin"},
  {q:"It always seems impossible until it's done.", sub:"在完成之前，一切看起来都不可能。", by:"Nelson Mandela"},
  {q:"Success is the sum of small efforts, repeated day in and day out.", sub:"成功，是日复一日微小努力的累加。", by:"Robert Collier"},
  {q:"不积跬步，无以至千里。", sub:"A journey of a thousand miles begins with a single step.", by:"荀子《劝学》"},
  {q:"The secret of getting ahead is getting started.", sub:"前进的秘诀，就是先开始。", by:"Mark Twain"},
  {q:"行百里者半九十。", sub:"越接近终点，越要坚持住。", by:"《战国策》"}
];
function pickQuote(){
  const pool=[];
  for(let i=0;i<QUOTES.length;i++) if(i!==state.lastQuote) pool.push(i);
  const i = pool.length ? pool[Math.floor(Math.random()*pool.length)] : 0;
  state.lastQuote=i; saveState();
  return QUOTES[i];
}

      <p style="font-size:13px">先去背点新词吧；昨天没复习完的会自动累加到今天。</p>
      <div class="home-actions" style="max-width:360px;margin:10px auto 0;flex-direction:column;gap:10px">
        <div class="btn primary" data-act="new" data-bid="${bid}">去背新词 ›</div>
        <div class="paper btn sec" style="border-radius:14px" data-act="home">首页</div>
      </div>
    </div></div>`;
}

/* ============ 保留的辅助页（收藏夹 / 错词本 / 目录，不出现在主流程） ============ */
function renderChapters(bid){
  setView(""); setAccent(bid);
  const b=DATA[bid];
  let chs='';
  b.chapters.forEach((ch,ci)=>{
    let masteredN=0;
    ch.terms.forEach(t=>{ if(isMastered(bid,t._id)) masteredN++; });
    chs += `<div class="paper chap" data-act="study" data-bid="${bid}" data-ci="${ci}">
      <span class="ill dot">${ILL.leaf}</span>
      <div class="cn"><div class="t">${ch.name}</div><div class="s">已掌握 ${masteredN}/${ch.terms.length}</div></div>
      <div class="go">›</div></div>`;
  });
  app.innerHTML = `
    <div class="topbar"><button class="back" data-act="home">‹</button>
      <div class="title">${b.title}</div><div class="meta">${b._terms.length} 词</div></div>
    <div class="scroll"><div class="pad" style="padding-top:6px">${chs}</div><div class="spacer"></div></div>`;
}
function renderFav(bid){
  setView(""); setAccent(bid);
  const ids=favIds(bid);
  let list='';
  if(!ids.length) list = `<div class="center-note">还没有收藏的单词。<br>背词时点右上角 ☆ 即可收藏。</div>`;
  else ids.forEach(id=>{
    const t=DATA[bid]._terms.find(x=>x._id===id);
    if(t) list += `<div class="paper favitem"><div class="fe"><div class="e">${esc(t.e)}</div><div class="m">${esc(t.m)}</div></div>
      <button class="x" data-act="fav-remove" data-bid="${bid}" data-id="${id}">✕</button></div>`;
  });
  app.innerHTML = `
    <div class="topbar"><button class="back" data-act="pick-book">‹</button>
      <div class="title">收藏夹</div><div class="meta">${ids.length}</div></div>
    <div class="scroll">
      ${ids.length?`<div class="pad"><div class="home-actions"><div class="paper ghost" data-act="study-fav" data-bid="${bid}">▶ 背诵收藏 (${ids.length})</div></div></div>`:''}
      ${list}<div class="spacer"></div></div>`;
}
function renderWrong(bid){
  setView(""); setAccent(bid);
  const ids=wrongIds(bid);
  let list='';
  if(!ids.length) list = `<div class="center-note">错词本是空的 🎉<br>答错或点「我选不会」的词会自动收进来。</div>`;
  else ids.forEach(id=>{
    const t=DATA[bid]._terms.find(x=>x._id===id);
    if(t) list += `<div class="paper favitem"><div class="fe"><div class="e">${esc(t.e)}</div><div class="m">${esc(t.m)}</div></div>
      <div class="chip ok" style="flex:0 0 auto">已连对 <b>${Math.min(getP(bid,id).streak||0,2)}</b>/2</div></div>`;
  });
  app.innerHTML = `
    <div class="topbar"><button class="back" data-act="pick-book">‹</button>
      <div class="title">错词本</div><div class="meta">${ids.length}</div></div>
    <div class="scroll">
      <div class="sticky orange" style="margin:14px 16px"><span class="pin"></span><span class="pin-t">错词说明</span>
        只练答错 / 选不会的词，连对 2 次自动毕业。当前 <b>${ids.length}</b> 个。</div>
      ${ids.length?`<div class="pad"><div class="home-actions"><div class="paper ghost" data-act="study-wrong" data-bid="${bid}">▶ 只练错词 (${ids.length})</div></div></div>`:''}
      ${list}<div class="spacer"></div></div>`;
}

/* ============ 事件 ============ */
app.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const bid = el.dataset.bid || curBook();

  /* —— 首页 / 词书 —— */
  if(act==="pick-book"){ renderBookPicker(); return; }
  if(act==="set-book"){
    state.curBook = el.dataset.book==="bio" ? "bio" : "cell";
    saveState(); renderHome(); return;
  }
  if(act==="home"){
    if(sess && sess.recheck) doRecheck(false);   // 离开前自动保持原判，不丢进度
    else if(sess && sess.mode==="study") savePos();
    renderHome(); return;
  }
  if(act==="undo"){ openRecheck(); return; }
  if(act==="recheck-keep"){ doRecheck(false); return; }
  if(act==="recheck-miss"){ doRecheck(true); return; }
  if(act==="new"){ startNew(bid); return; }
  if(act==="review"){ startReview(bid); return; }

  /* —— 背新词作答 —— */
  if(act==="choose" || act==="skip"){
    if(!sess || sess.mode==="review") return;
    const term=currentTerm(); const id=term._id; const b=sess.bid;
    if(sess.answered[id]) return;
    const correct = act==="choose" ? (el.dataset.m===term.m) : false;
    recordCard(id, { ph:"study", result:{ correct:correct, skip:act==="skip" },
      beforeP:cp(state[b].p[id]), beforeNR:cp(state[b].newRound) });
    if(act==="choose"){
      sess.answered[id]={choice:+el.dataset.i, correct, skip:false};
      record(b,id,correct);
    } else {
      sess.answered[id]={choice:-1, correct:false, skip:true};
      record(b,id,false);
    }
    sess.cards[id].afterP = cp(state[b].p[id]);
    savePos(); renderStudy(); return;
  }
  if(act==="fav-toggle"){
    if(!sess) return;
    const id = sess.mode==="review" ? sess.queue[0].id : currentTerm()._id;
    const p=getP(sess.bid,id); p.fav=!p.fav; saveP(sess.bid,id,p);
    (sess.mode==="review" ? renderReview() : renderStudy()); return;
  }
  if(act==="next"){
    if(sess && sess.mode!=="review" && sess.pos<sess.queue.length-1){ sess.pos++; savePos(); renderStudy(); }
    return;
  }
  if(act==="finish"){
    if(sess && sess.mode!=="review"){ finishRound(); renderDone(); }
    return;
  }

  /* —— 复习：阶段一 会 / 不会 —— */
  if(act==="judge"){
    if(!sess || sess.mode!=="review" || sess.ans) return;
    sess.ans = { ph:"judge", know: el.dataset.v==="1" };
    renderReview(); return;
  }
  /* —— 复习：记错词的强化选择题 —— */
  if(act==="quiz-choose"){
    if(!sess || sess.mode!=="review" || sess.ans) return;
    const term=reviewTerm();
    const correct = (el.dataset.m===term.m);
    sess.ans = { ph:"quiz", correct, choice:+el.dataset.i };
    renderReview(); return;
  }
  if(act==="rv-next" || act==="rv-wrong"){
    reviewAdvance(act==="rv-next" ? "pass" : "wrong"); return;
  }

  /* —— 辅助页入口 —— */
  if(act==="fav"){ renderFav(bid); return; }
  if(act==="wrong"){ renderWrong(bid); return; }
  if(act==="fav-remove"){
    const p=getP(bid,el.dataset.id); p.fav=false; saveP(bid,el.dataset.id,p); renderFav(bid); return;
  }
  if(act==="study-wrong"){ const ids=wrongIds(bid); if(ids.length) startSession(bid,"wrong",ids,0); return; }
  if(act==="study-fav"){ const ids=favIds(bid); if(ids.length) startSession(bid,"fav",ids,0); return; }
  if(act==="study"){ startNew(bid); return; }
  if(act==="chapters" || act==="open"){ renderHome(); return; }

  if(act==="reset"){
    const keep=state.curBook;
    if(window.confirm && !confirm("确定清空两本书的全部学习进度（掌握度、复习计划、错词）吗？此操作不可恢复。")) return;
    state={cell:{p:{}},bio:{p:{}},cellVer:CELL_LIB_VER,curBook:keep}; saveState(); renderHome();
  }
});

renderHome();

</script>
